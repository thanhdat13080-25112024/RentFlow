<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RentFlow — Web UI Kit</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{background:var(--paper);font-family:var(--font-sans);color:var(--ink-1);}
  i[data-lucide]{stroke-width:1.75px;}
  a{color:inherit;}
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <script type="text/babel" src="web-components.jsx"></script>
  <script type="text/babel" src="web-sections.jsx"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function Site() {
      const [view, setView] = useState('home');     // 'home' | 'browse'
      const [detail, setDetail] = useState(null);

      useEffect(() => { if (window.lucide) window.lucide.createIcons(); });
      useEffect(() => { window.scrollTo(0, 0); }, [view]);

      const open = (item) => setDetail(item);

      return (
        <div>
          <WNav view={view} setView={(v) => { setDetail(null); setView(v); }} />
          {view === 'home' ? (
            <main>
              <WHero onSearch={() => setView('browse')} />
              <WFeatured onOpen={open} onBrowse={() => setView('browse')} />
              <WHowItWorks />
              <WCta />
            </main>
          ) : (
            <main style={{ minHeight: '70vh' }}>
              <WBrowse onOpen={open} />
            </main>
          )}
          <WFooter />
          {detail && <WDetailModal item={detail} onClose={() => setDetail(null)} />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Site />);
  </script>
</body>
</html>
