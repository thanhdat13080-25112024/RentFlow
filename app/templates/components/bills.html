<!-- ═══════════════════════════════════════
     TAB: BILLS (Master / Detail)
═══════════════════════════════════════ -->
<div x-show="activeTab === 'bills'" class="space-y-4">
    <!-- Filter bar -->
    <div class="card-static px-4 py-3 flex flex-wrap gap-3 items-center">
        <div class="flex rounded-lg p-1 gap-0.5 bg-gray-100">
            <button @click="billTab = 'all'"
                    :class="billTab === 'all' ? 'tab-active' : 'tab-btn'"
                    class="px-3 py-1 rounded-lg text-sm font-semibold transition">
                <span x-text="t.filterAll"></span>
                <span class="ml-1 text-xs opacity-60" x-text="bills.filter(b=>b.is_occupied).length"></span>
            </button>
            <button @click="billTab = 'unpaid'"
                    :class="billTab === 'unpaid' ? 'tab-btn' : 'tab-btn'"
                    :style="billTab === 'unpaid'
                        ? 'background: var(--color-surface-solid); box-shadow: var(--shadow-glass-xs); color: var(--color-unpaid)'
                        : ''"
                    class="px-3 py-1 rounded-lg text-sm font-semibold transition">
                <span x-text="t.filterUnpaid"></span>
                <span class="ml-1 text-xs opacity-60" x-text="bills.filter(b=>b.status==='unpaid'&&b.is_occupied).length"></span>
            </button>
            <button @click="billTab = 'paid'"
                    :class="billTab === 'paid' ? 'tab-btn' : 'tab-btn'"
                    :style="billTab === 'paid'
                        ? 'background: var(--color-surface-solid); box-shadow: var(--shadow-glass-xs); color: var(--color-paid)'
                        : ''"
                    class="px-3 py-1 rounded-lg text-sm font-semibold transition">
                <span x-text="t.filterPaid"></span>
                <span class="ml-1 text-xs opacity-60" x-text="bills.filter(b=>b.status==='paid').length"></span>
            </button>
            <button @click="billTab = 'prepaid'"
                    :class="billTab === 'prepaid' ? 'tab-btn' : 'tab-btn'"
                    :style="billTab === 'prepaid'
                        ? 'background: var(--color-surface-solid); box-shadow: var(--shadow-glass-xs); color: var(--color-prepaid)'
                        : ''"
                    class="px-3 py-1 rounded-lg text-sm font-semibold transition">
                <span x-text="t.filterPrepaid"></span>
                <span class="ml-1 text-xs opacity-60" x-text="bills.filter(b=>b.status==='prepaid').length"></span>
            </button>
        </div>
        <div class="flex-1 min-w-36 md:hidden">
            <input x-model="searchQuery" :placeholder="t.search" class="input-base">
        </div>
    </div>

    <!-- Master / Detail grid -->
    <div class="grid gap-4" :class="!isMobile ? 'grid-cols-[1fr_1.1fr]' : 'grid-cols-1'">
        <!-- List pane -->
        <div x-show="!isMobile || !selectedBillId"
             class="card-static overflow-hidden">
            <div class="px-4 py-3 border-b grid th-cell"
                 style="grid-template-columns:56px 1fr 100px 104px; background: var(--color-primary-light)">
                <span x-text="t.room"></span>
                <span x-text="t.tenant"></span>
                <span class="text-right" x-text="t.total"></span>
                <span class="text-center" x-text="t.status"></span>
            </div>
            <div class="divide-y divide-gray-50 overflow-y-auto max-h-[70vh]">
                <template x-for="bill in filteredBills" :key="bill.room_id">
                    <div @click="selectedBillId = bill.room_id"
                         class="grid px-4 py-3 cursor-pointer transition items-center"
                         style="grid-template-columns:56px 1fr 100px 104px"
                         :class="selectedBillId === bill.room_id
                             ? 'border-l-4 border-blue-600'
                             : 'hover:bg-gray-50 border-l-4 border-transparent'"
                         :style="selectedBillId === bill.room_id
                             ? 'background: var(--color-primary-light)'
                             : ''">
                        <span class="text-lg font-extrabold" :class="getFloorText(bill.room_number)"
                              x-text="bill.room_number"></span>
                        <div class="min-w-0">
                            <p class="font-semibold text-gray-800 text-sm truncate" x-text="bill.contact_info || '—'"></p>
                        </div>
                        <span class="text-right font-bold text-sm text-gray-800" x-text="formatMoney(bill.total)"></span>
                        <span class="text-center">
                            <span class="badge"
                                  :class="bill.status==='paid' ? 'badge--paid' : bill.status==='prepaid' ? 'badge--prepaid' : 'badge--unpaid'"
                                  x-text="t.status_map[bill.status] || bill.status"></span>
                        </span>
                    </div>
                </template>
                <template x-if="filteredBills.length === 0">
                    <div class="empty-state">
                        <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
                             class="empty-state__icon">
                            <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
                        </svg>
                        <p class="empty-state__text" x-text="t.noBills"></p>
                    </div>
                </template>
            </div>
        </div>

        <!-- Detail pane -->
        <div x-show="!isMobile || selectedBillId">
            <template x-if="!selectedBill">
                <div class="card-static empty-state">
                    <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
                         class="empty-state__icon">
                        <path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
                    </svg>
                    <p class="empty-state__text" x-text="t.selectRoom"></p>
                </div>
            </template>
            <template x-if="selectedBill">
                <div class="card-static overflow-hidden slide-up">
                    <!-- Mobile back -->
                    <div x-show="isMobile" class="px-4 pt-4">
                        <button @click="selectedBillId = null"
                                class="flex items-center gap-2 text-sm font-semibold mb-3"
                                style="color: var(--color-primary)">
                            ← <span x-text="t.back"></span>
                        </button>
                    </div>

                    <!-- Header — tinted by status -->
                    <div class="px-5 py-4 border-b flex items-center gap-4"
                         :style="selectedBill.status === 'unpaid'
                             ? 'background: var(--color-unpaid-bg); border-color: var(--color-unpaid-border)'
                             : selectedBill.status === 'prepaid'
                                 ? 'background: var(--color-prepaid-bg); border-color: var(--color-prepaid-border)'
                                 : 'background: var(--color-paid-bg); border-color: var(--color-paid-border)'">
                        <div class="w-12 h-12 rounded-xl flex items-center justify-center text-white font-extrabold text-lg shrink-0"
                             :class="getFloorBg(selectedBill.room_number)" x-text="selectedBill.room_number"></div>
                        <div class="flex-1 min-w-0">
                            <h3 class="font-extrabold text-gray-800 text-lg truncate"
                                x-text="selectedBill.contact_info || '—'"></h3>
                            <p class="text-xs" style="color: var(--color-text-tertiary)">
                                <span x-show="selectedBill.move_in_date"
                                      x-text="t.moveIn + ' ' + displayDate(selectedBill.move_in_date)"></span>
                            </p>
                        </div>
                        <span class="badge shrink-0"
                              :class="selectedBill.status==='paid' ? 'badge--paid' : selectedBill.status==='prepaid' ? 'badge--prepaid' : 'badge--unpaid'"
                              x-text="t.status_map[selectedBill.status] || selectedBill.status"></span>
                    </div>

                    <div class="p-5 space-y-4">
                        <!-- Electricity reading -->
                        <div class="rounded-lg p-4 border"
                             style="background: var(--color-surface-solid); border-color: var(--color-border)">
                            <p class="th-cell block mb-3" x-text="t.electricity + ' ' + t.month + ' ' + month"></p>
                            <div class="flex items-center gap-4">
                                <div class="flex-1 text-center">
                                    <p class="text-xs text-gray-400 mb-1" x-text="t.oldReading"></p>
                                    <p class="text-2xl font-extrabold text-gray-400" x-text="selectedBill.old_reading"></p>
                                </div>
                                <span class="text-gray-300">→</span>
                                <div class="flex-1 text-center">
                                    <p class="text-xs text-gray-400 mb-1" x-text="t.newReading"></p>
                                    <input type="number" x-model.number="selectedBill.new_reading"
                                           @change="updateElectricity(selectedBill)"
                                           :disabled="selectedBill.status !== 'unpaid'"
                                           class="w-full border-2 rounded-lg text-center text-2xl font-extrabold py-1 outline-none transition disabled:opacity-50"
                                           :style="{
                                               borderColor: selectedBill.new_reading === 0
                                                   ? 'var(--color-warning-border)'
                                                   : 'var(--color-primary-muted)',
                                               background: selectedBill.new_reading === 0
                                                   ? 'var(--color-warning-bg)'
                                                   : 'var(--color-surface-solid)',
                                               color: 'var(--color-primary)'
                                           }">
                                </div>
                                <div class="flex-1 text-center">
                                    <p class="text-xs text-gray-400 mb-1" x-text="t.usage"></p>
                                    <p class="text-2xl font-extrabold"
                                       style="color: var(--color-chart-primary)"
                                       x-text="(selectedBill.new_reading - selectedBill.old_reading || 0)"></p>
                                </div>
                            </div>
                            <p x-show="selectedBill.new_reading === 0 && !selectedBill.is_fixed"
                               class="text-xs font-semibold mt-2"
                               style="color: var(--color-warning)"
                               x-text="t.noElecInput"></p>
                        </div>

                        <!-- Breakdown -->
                        <div class="rounded-lg p-4 border space-y-2"
                             style="background: var(--color-surface-solid); border-color: var(--color-border)">
                            <p class="th-cell block mb-3" x-text="t.breakdown"></p>
                            <div class="flex justify-between text-sm py-1.5 border-b" style="border-color: var(--color-border)">
                                <span style="color: var(--color-text-secondary)" x-text="t.rentFee"></span>
                                <span class="font-semibold" style="color: var(--color-text-primary)" x-text="formatMoney(selectedBill.rent_fee)"></span>
                            </div>
                            <div class="flex justify-between text-sm py-1.5 border-b" style="border-color: var(--color-border)">
                                <span style="color: var(--color-text-secondary)" x-text="t.serviceFee"></span>
                                <span class="font-semibold" style="color: var(--color-text-primary)" x-text="formatMoney(selectedBill.service_fee)"></span>
                            </div>
                            <div class="flex justify-between text-sm py-1.5 border-b" style="border-color: var(--color-border)">
                                <span style="color: var(--color-text-secondary)" x-text="t.electricityFee"></span>
                                <span class="font-semibold" style="color: var(--color-text-primary)" x-text="formatMoney(selectedBill.electricity_fee)"></span>
                            </div>
                            <div class="flex justify-between items-baseline pt-1">
                                <span class="font-bold" style="color: var(--color-text-primary)" x-text="t.totalAmount"></span>
                                <span class="text-2xl font-extrabold"
                                      style="color: var(--color-primary)"
                                      x-text="formatMoney(selectedBill.total)"></span>
                            </div>
                        </div>

                        <!-- Actions -->
                        <div class="grid grid-cols-2 gap-3">
                            <button @click="toggleStatus(selectedBill)"
                                    x-show="selectedBill.status === 'unpaid'"
                                    class="btn btn--success btn--lg col-span-2">
                                ✓ <span x-text="t.markPaid"></span>
                            </button>
                            <button @click="toggleStatus(selectedBill)"
                                    x-show="selectedBill.status === 'paid'"
                                    class="btn btn--lg col-span-2"
                                    style="background: var(--color-prepaid-bg);
                                           color: var(--color-prepaid-text);
                                           border: 1px solid var(--color-prepaid-border)">
                                ◻ <span x-text="t.prepaid"></span>
                            </button>
                            <button @click="showQR(selectedBill)" class="btn btn--ghost">
                                ▣ <span x-text="t.qrBtn"></span>
                            </button>
                            <button @click="openEditModal(selectedBill)" class="btn btn--ghost">
                                ✎ <span x-text="t.edit"></span>
                            </button>
                        </div>

                        <!-- Footer -->
                        <div class="flex justify-between text-xs pt-1" style="color: var(--color-text-tertiary)">
                            <span><span x-text="t.deposit + ': '"></span>
                            <b style="color: var(--color-text-secondary)" x-text="formatMoney(selectedBill.deposit)"></b></span>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </div>
</div>
