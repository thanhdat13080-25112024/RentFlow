<!-- ═══════════════════════════════════════
     TAB: BILLS (Master / Detail)
═══════════════════════════════════════ -->
<div x-show="activeTab === 'bills'" class="space-y-4">
    <!-- Filter bar -->
    <div class="bg-white rounded-xl border border-gray-100 shadow-sm px-4 py-3 flex flex-wrap gap-3 items-center">
        <div class="flex bg-gray-100 rounded-lg p-1 gap-0.5">
            <button @click="billTab = 'all'"
                    :class="billTab === 'all' ? 'tab-active' : 'text-gray-500 hover:text-gray-700'"
                    class="px-3 py-1 rounded-md text-sm font-semibold transition">
                <span x-text="t.filterAll"></span>
                <span class="ml-1 text-xs opacity-60" x-text="bills.filter(b=>b.is_occupied).length"></span>
            </button>
            <button @click="billTab = 'unpaid'"
                    :class="billTab === 'unpaid' ? 'bg-white shadow text-red-600' : 'text-gray-500 hover:text-gray-700'"
                    class="px-3 py-1 rounded-md text-sm font-semibold transition">
                <span x-text="t.filterUnpaid"></span>
                <span class="ml-1 text-xs opacity-60" x-text="bills.filter(b=>b.status==='unpaid'&&b.is_occupied).length"></span>
            </button>
            <button @click="billTab = 'paid'"
                    :class="billTab === 'paid' ? 'bg-white shadow text-green-600' : 'text-gray-500 hover:text-gray-700'"
                    class="px-3 py-1 rounded-md text-sm font-semibold transition">
                <span x-text="t.filterPaid"></span>
                <span class="ml-1 text-xs opacity-60" x-text="bills.filter(b=>b.status==='paid').length"></span>
            </button>
            <button @click="billTab = 'prepaid'"
                    :class="billTab === 'prepaid' ? 'bg-white shadow text-blue-600' : 'text-gray-500 hover:text-gray-700'"
                    class="px-3 py-1 rounded-md text-sm font-semibold transition">
                <span x-text="t.filterPrepaid"></span>
                <span class="ml-1 text-xs opacity-60" x-text="bills.filter(b=>b.status==='prepaid').length"></span>
            </button>
        </div>
        <div class="flex-1 min-w-36 md:hidden">
            <input x-model="searchQuery" :placeholder="t.search"
                   class="w-full border border-gray-200 rounded-lg px-3 py-1.5 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
        </div>
    </div>

    <!-- Master / Detail grid -->
    <div class="grid gap-4" :class="!isMobile ? 'grid-cols-[1fr_1.1fr]' : 'grid-cols-1'">
        <!-- List pane -->
        <div x-show="!isMobile || !selectedBillId"
             class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
            <div class="px-4 py-3 border-b bg-gray-50 grid text-xs font-bold text-gray-500 uppercase tracking-wide"
                 style="grid-template-columns:56px 1fr 100px 80px">
                <span x-text="t.room"></span>
                <span x-text="t.tenant"></span>
                <span class="text-right" x-text="t.total"></span>
                <span class="text-center" x-text="t.status"></span>
            </div>
            <div class="divide-y divide-gray-50 overflow-y-auto max-h-[70vh]">
                <template x-for="bill in filteredBills" :key="bill.room_id">
                    <div @click="selectedBillId = bill.room_id"
                         class="grid px-4 py-3 cursor-pointer transition items-center"
                         style="grid-template-columns:56px 1fr 100px 80px"
                         :class="selectedBillId === bill.room_id ? 'bg-blue-50 border-l-4 border-blue-600' : 'hover:bg-gray-50 border-l-4 border-transparent'">
                        <span class="text-lg font-extrabold" :class="getFloorText(bill.room_number)" x-text="bill.room_number"></span>
                        <div class="min-w-0">
                            <p class="font-semibold text-gray-800 text-sm truncate" x-text="bill.contact_info || '—'"></p>
                            <p class="text-xs text-gray-400 truncate" x-show="bill.contact_info && bill.contact_info.includes(' ')">
                            </p>
                        </div>
                        <span class="text-right font-bold text-sm text-gray-800" x-text="formatMoney(bill.total)"></span>
                        <span class="text-center">
                            <span class="px-2 py-0.5 rounded-full text-[10px] font-bold"
                                  :class="bill.status==='paid' ? 'bg-green-100 text-green-700' : bill.status==='prepaid' ? 'bg-blue-100 text-blue-700' : 'bg-red-100 text-red-700'"
                                  x-text="t.status_map[bill.status] || bill.status"></span>
                        </span>
                    </div>
                </template>
                <template x-if="filteredBills.length === 0">
                    <div class="py-16 text-center text-gray-300">
                        <i class="fas fa-inbox text-4xl mb-3 block"></i>
                        <p class="text-sm font-semibold" x-text="t.noBills"></p>
                    </div>
                </template>
            </div>
        </div>

        <!-- Detail pane -->
        <div x-show="!isMobile || selectedBillId">
            <template x-if="!selectedBill">
                <div class="bg-white rounded-xl border border-gray-100 shadow-sm flex flex-col items-center justify-center h-64 text-gray-300">
                    <i class="fas fa-hand-pointer text-4xl mb-3"></i>
                    <p class="text-sm font-semibold" x-text="t.selectRoom"></p>
                </div>
            </template>
            <template x-if="selectedBill">
                <div class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden slide-up">
                    <!-- Mobile back -->
                    <div x-show="isMobile" class="px-4 pt-4">
                        <button @click="selectedBillId = null" class="flex items-center gap-2 text-sm text-blue-600 font-semibold mb-3">
                            <i class="fas fa-arrow-left"></i> <span x-text="t.back"></span>
                        </button>
                    </div>

                    <!-- Header -->
                    <div class="px-5 py-4 border-b flex items-center gap-4"
                         :class="selectedBill.status === 'unpaid' ? 'bg-red-50' : selectedBill.status === 'prepaid' ? 'bg-blue-50' : 'bg-green-50'">
                        <div class="w-12 h-12 rounded-xl flex items-center justify-center text-white font-extrabold text-lg shrink-0"
                             :class="getFloorBg(selectedBill.room_number)" x-text="selectedBill.room_number"></div>
                        <div class="flex-1 min-w-0">
                            <h3 class="font-extrabold text-gray-800 text-lg truncate" x-text="selectedBill.contact_info || '—'"></h3>
                            <p class="text-xs text-gray-500">
                                <span x-show="selectedBill.move_in_date" x-text="t.moveIn + ' ' + selectedBill.move_in_date"></span>
                            </p>
                        </div>
                        <span class="px-3 py-1 rounded-full text-xs font-bold shrink-0"
                              :class="selectedBill.status==='paid' ? 'bg-green-100 text-green-700' : selectedBill.status==='prepaid' ? 'bg-blue-100 text-blue-700' : 'bg-red-100 text-red-700'"
                              x-text="t.status_map[selectedBill.status] || selectedBill.status"></span>
                    </div>

                    <div class="p-5 space-y-4">
                        <!-- Electricity reading -->
                        <div class="bg-gray-50 rounded-xl p-4 border border-gray-100">
                            <p class="text-xs font-bold text-gray-500 uppercase tracking-wide mb-3" x-text="t.electricity + ' ' + t.month + ' ' + month"></p>
                            <div class="flex items-center gap-4">
                                <div class="flex-1 text-center">
                                    <p class="text-xs text-gray-400 mb-1" x-text="t.oldReading"></p>
                                    <p class="text-2xl font-extrabold text-gray-400" x-text="selectedBill.old_reading"></p>
                                </div>
                                <i class="fas fa-arrow-right text-gray-300"></i>
                                <div class="flex-1 text-center">
                                    <p class="text-xs text-gray-400 mb-1" x-text="t.newReading"></p>
                                    <input type="number" x-model.number="selectedBill.new_reading"
                                           @change="updateElectricity(selectedBill)"
                                           :disabled="selectedBill.status !== 'unpaid'"
                                           :class="selectedBill.new_reading === 0 ? 'border-amber-400 bg-amber-50' : 'border-blue-300 bg-white'"
                                           class="w-full border-2 rounded-lg text-center text-2xl font-extrabold text-blue-600 py-1 outline-none focus:ring-2 focus:ring-blue-500 transition disabled:opacity-50">
                                </div>
                                <div class="flex-1 text-center">
                                    <p class="text-xs text-gray-400 mb-1" x-text="t.usage"></p>
                                    <p class="text-2xl font-extrabold text-indigo-600"
                                       x-text="(selectedBill.new_reading - selectedBill.old_reading || 0)"></p>
                                </div>
                            </div>
                            <p x-show="selectedBill.new_reading === 0 && !selectedBill.is_fixed"
                               class="text-xs text-amber-600 font-semibold mt-2 flex items-center gap-1">
                                <i class="fas fa-triangle-exclamation"></i> <span x-text="t.noElecInput"></span>
                            </p>
                        </div>

                        <!-- Breakdown -->
                        <div class="bg-gray-50 rounded-xl p-4 border border-gray-100 space-y-2">
                            <p class="text-xs font-bold text-gray-500 uppercase tracking-wide mb-3" x-text="t.breakdown"></p>
                            <div class="flex justify-between text-sm py-1.5 border-b border-gray-100">
                                <span class="text-gray-600" x-text="t.rentFee"></span>
                                <span class="font-semibold" x-text="formatMoney(selectedBill.rent_fee)"></span>
                            </div>
                            <div class="flex justify-between text-sm py-1.5 border-b border-gray-100">
                                <span class="text-gray-600" x-text="t.serviceFee"></span>
                                <span class="font-semibold" x-text="formatMoney(selectedBill.service_fee)"></span>
                            </div>
                            <div class="flex justify-between text-sm py-1.5 border-b border-gray-100">
                                <span class="text-gray-600" x-text="t.electricityFee"></span>
                                <span class="font-semibold" x-text="formatMoney(selectedBill.electricity_fee)"></span>
                            </div>
                            <div class="flex justify-between items-baseline pt-1">
                                <span class="font-bold text-gray-800" x-text="t.totalAmount"></span>
                                <span class="text-2xl font-extrabold text-blue-600" x-text="formatMoney(selectedBill.total)"></span>
                            </div>
                        </div>

                        <!-- Actions -->
                        <div class="grid grid-cols-2 gap-3">
                            <button @click="toggleStatus(selectedBill)"
                                    x-show="selectedBill.status === 'unpaid'"
                                    class="col-span-2 bg-green-600 hover:bg-green-700 text-white py-3 rounded-xl font-bold transition flex items-center justify-center gap-2">
                                <i class="fas fa-circle-check"></i> <span x-text="t.markPaid"></span>
                            </button>
                            <button @click="toggleStatus(selectedBill)"
                                    x-show="selectedBill.status === 'paid'"
                                    class="col-span-2 bg-blue-100 hover:bg-blue-200 text-blue-700 py-3 rounded-xl font-bold transition flex items-center justify-center gap-2">
                                <i class="fas fa-calendar-check"></i> <span x-text="t.prepaid"></span>
                            </button>
                            <button @click="showQR(selectedBill)"
                                    class="bg-gray-100 hover:bg-gray-200 text-gray-700 py-2.5 rounded-xl font-semibold text-sm transition flex items-center justify-center gap-2">
                                <i class="fas fa-qrcode"></i> <span x-text="t.qrBtn"></span>
                            </button>
                            <button @click="openEditModal(selectedBill)"
                                    class="bg-gray-100 hover:bg-gray-200 text-gray-700 py-2.5 rounded-xl font-semibold text-sm transition flex items-center justify-center gap-2">
                                <i class="fas fa-pen-to-square"></i> <span x-text="t.edit"></span>
                            </button>
                        </div>

                        <!-- Footer info -->
                        <div class="flex justify-between text-xs text-gray-400 pt-1">
                            <span><span x-text="t.deposit + ': '"></span><b class="text-gray-700" x-text="formatMoney(selectedBill.deposit)"></b></span>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </div>
</div>
