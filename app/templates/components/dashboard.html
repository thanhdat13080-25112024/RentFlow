<!-- ═══════════════════════════════════════
     TAB: DASHBOARD
═══════════════════════════════════════ -->
<div x-show="activeTab === 'dashboard'" class="space-y-6">

    <!-- Greeting + actions -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
            <h1 class="text-2xl font-extrabold text-gray-800">
                <span x-text="getGreeting()"></span>
                <template x-if="settings.account_holder">
                    <span class="text-blue-600">, <span x-text="settings.account_holder"></span></span>
                </template>
                <span> 👋</span>
            </h1>
            <p class="text-sm text-gray-400 mt-1">
                <span x-text="todayStr()"></span> —
                <template x-if="stats.unpaidCount > 0">
                    <span><b class="text-red-600" x-text="stats.unpaidCount"></b> <span x-text="t.dashUnpaidNote"></span></span>
                </template>
                <template x-if="stats.unpaidCount === 0">
                    <span class="text-green-600 font-semibold" x-text="t.dashAllPaid"></span>
                </template>
            </p>
        </div>
        <div class="flex gap-2">
            <button @click="$refs.csvFile.click()"
                    class="flex items-center gap-2 px-4 py-2 rounded-lg border border-gray-200 bg-white hover:bg-gray-50 text-sm font-semibold text-gray-600 transition">
                <i class="fas fa-file-import text-emerald-500"></i>
                <span class="hidden sm:block" x-text="t.importCSV"></span>
            </button>
            <button @click="activeTab = 'revenue'"
                    class="flex items-center gap-2 px-4 py-2 rounded-lg bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold transition">
                <i class="fas fa-chart-line"></i>
                <span class="hidden sm:block" x-text="t.tabs.revenue"></span>
            </button>
        </div>
    </div>

    <!-- 6 stat tiles -->
    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-4">
        <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-4 flex items-center gap-3 hover:shadow-md transition">
            <div class="w-10 h-10 bg-gray-800 rounded-xl flex items-center justify-center shrink-0">
                <i class="fas fa-door-open text-white text-sm"></i>
            </div>
            <div>
                <p class="text-[10px] text-gray-400 font-bold uppercase tracking-wide" x-text="t.statTotalRooms"></p>
                <p class="text-xl font-extrabold text-gray-800" x-text="stats.totalRooms"></p>
                <p class="text-[10px] text-gray-400" x-text="stats.occupiedCount + ' ' + t.statOccupied + ' · ' + stats.emptyCount + ' ' + t.statEmpty"></p>
            </div>
        </div>
        <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-4 flex items-center gap-3 hover:shadow-md transition">
            <div class="w-10 h-10 bg-red-500 rounded-xl flex items-center justify-center shrink-0">
                <i class="fas fa-clock text-white text-sm"></i>
            </div>
            <div>
                <p class="text-[10px] text-gray-400 font-bold uppercase tracking-wide" x-text="t.statUnpaid"></p>
                <p class="text-xl font-extrabold text-red-600" x-text="stats.unpaidCount"></p>
                <p class="text-[10px] text-gray-400" x-text="t.statRooms"></p>
            </div>
        </div>
        <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-4 flex items-center gap-3 hover:shadow-md transition">
            <div class="w-10 h-10 bg-green-500 rounded-xl flex items-center justify-center shrink-0">
                <i class="fas fa-circle-check text-white text-sm"></i>
            </div>
            <div>
                <p class="text-[10px] text-gray-400 font-bold uppercase tracking-wide" x-text="t.statPaid"></p>
                <p class="text-xl font-extrabold text-green-600" x-text="stats.paidCount"></p>
                <p class="text-[10px] text-gray-400" x-text="t.statRooms"></p>
            </div>
        </div>
        <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-4 flex items-center gap-3 hover:shadow-md transition">
            <div class="w-10 h-10 bg-blue-500 rounded-xl flex items-center justify-center shrink-0">
                <i class="fas fa-calendar-check text-white text-sm"></i>
            </div>
            <div>
                <p class="text-[10px] text-gray-400 font-bold uppercase tracking-wide" x-text="t.statPrepaid"></p>
                <p class="text-xl font-extrabold text-blue-600" x-text="stats.prepaidCount"></p>
                <p class="text-[10px] text-gray-400" x-text="t.statRooms"></p>
            </div>
        </div>
        <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-4 flex items-center gap-3 hover:shadow-md transition">
            <div class="w-10 h-10 bg-emerald-600 rounded-xl flex items-center justify-center shrink-0">
                <i class="fas fa-wallet text-white text-sm"></i>
            </div>
            <div>
                <p class="text-[10px] text-gray-400 font-bold uppercase tracking-wide" x-text="t.statCollected"></p>
                <p class="text-base font-extrabold text-emerald-700" x-text="formatMoney(stats.collectedAmount)"></p>
                <p class="text-[10px] text-gray-400" x-text="t.statThisMonth"></p>
            </div>
        </div>
        <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-4 flex items-center gap-3 hover:shadow-md transition">
            <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center shrink-0">
                <i class="fas fa-coins text-white text-sm"></i>
            </div>
            <div>
                <p class="text-[10px] text-gray-400 font-bold uppercase tracking-wide" x-text="t.statDeposit"></p>
                <p class="text-base font-extrabold text-indigo-700" x-text="formatMoney(stats.depositTotal)"></p>
                <p class="text-[10px] text-gray-400" x-text="stats.occupiedCount + ' ' + t.statRooms"></p>
            </div>
        </div>
    </div>

    <!-- Charts + attention row -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- Bar chart -->
        <div class="lg:col-span-2 bg-white rounded-xl border border-gray-100 shadow-sm p-5">
            <div class="flex items-center justify-between mb-4">
                <div>
                    <h3 class="font-bold text-gray-800" x-text="t.chartTitle"></h3>
                    <p class="text-xs text-gray-400" x-text="t.chartSubtitle"></p>
                </div>
            </div>
            <div class="flex items-end gap-2 h-44 border-b border-gray-100 pb-1">
                <template x-if="dashboardChart.length === 0">
                    <div class="w-full flex items-center justify-center text-gray-300">
                        <i class="fas fa-chart-bar text-4xl"></i>
                    </div>
                </template>
                <template x-for="bar in dashboardChart" :key="bar.label">
                    <div class="flex flex-col items-center justify-end gap-1 flex-1 h-full">
                        <span class="text-[10px] text-gray-400 font-semibold" x-text="(bar.v/1e6).toFixed(1)+'M'"></span>
                        <div class="w-full rounded-t-lg bar-segment transition-all"
                             :class="bar.current ? 'bg-blue-600' : 'bg-blue-200'"
                             :style="'height:' + Math.max(bar.pct, 5) + '%'">
                        </div>
                        <span class="text-[10px] font-semibold" :class="bar.current ? 'text-blue-600' : 'text-gray-400'" x-text="bar.label"></span>
                    </div>
                </template>
            </div>
            <div class="mt-3 flex items-center gap-4 text-xs text-gray-400">
                <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-blue-600 inline-block"></span> <span x-text="t.statThisMonth"></span></span>
                <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-blue-200 inline-block"></span> <span x-text="t.statPrevMonths"></span></span>
            </div>
        </div>

        <!-- Donut -->
        <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-5">
            <h3 class="font-bold text-gray-800 mb-4" x-text="t.donutTitle + ' ' + month + '/' + year"></h3>
            <div class="flex items-center gap-6">
                <div class="relative shrink-0">
                    <svg viewBox="0 0 36 36" class="w-28 h-28 -rotate-90">
                        <circle cx="18" cy="18" r="15.9155" fill="none" stroke="#f3f4f6" stroke-width="4"/>
                        <circle cx="18" cy="18" r="15.9155" fill="none" stroke="#16a34a" stroke-width="4"
                                :stroke-dasharray="donut.paid + ' 100'"
                                stroke-dashoffset="0"/>
                        <circle cx="18" cy="18" r="15.9155" fill="none" stroke="#2563eb" stroke-width="4"
                                :stroke-dasharray="donut.prepaid + ' 100'"
                                :stroke-dashoffset="-donut.paidOffset"/>
                        <circle cx="18" cy="18" r="15.9155" fill="none" stroke="#ef4444" stroke-width="4"
                                :stroke-dasharray="donut.unpaid + ' 100'"
                                :stroke-dashoffset="-donut.unpaidOffset"/>
                    </svg>
                    <div class="absolute inset-0 flex flex-col items-center justify-center rotate-90">
                        <span class="text-xl font-extrabold text-gray-800" x-text="donut.paidPct + '%'"></span>
                        <span class="text-[10px] text-gray-400 font-semibold" x-text="t.statPaid"></span>
                    </div>
                </div>
                <div class="space-y-3 flex-1">
                    <div class="flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full bg-green-600 shrink-0"></span>
                        <span class="text-sm flex-1" x-text="t.statPaid"></span>
                        <b class="text-lg font-extrabold text-gray-800" x-text="donut.paidCount"></b>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full bg-red-500 shrink-0"></span>
                        <span class="text-sm flex-1" x-text="t.statUnpaid"></span>
                        <b class="text-lg font-extrabold text-gray-800" x-text="donut.unpaidCount"></b>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full bg-blue-600 shrink-0"></span>
                        <span class="text-sm flex-1" x-text="t.statPrepaid"></span>
                        <b class="text-lg font-extrabold text-gray-800" x-text="donut.prepaidCount"></b>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Attention + Activity -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <!-- Rooms needing attention -->
        <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-5">
            <div class="flex items-center justify-between mb-4">
                <h3 class="font-bold text-gray-800" x-text="t.attentionTitle"></h3>
                <span class="text-xs text-gray-400" x-text="stats.unpaidCount + ' ' + t.statRooms"></span>
            </div>
            <template x-if="attentionRooms.length === 0">
                <div class="py-8 text-center text-gray-400">
                    <i class="fas fa-party-horn text-3xl text-green-300 mb-2 block"></i>
                    <span class="text-sm font-semibold" x-text="t.dashAllPaid"></span>
                </div>
            </template>
            <div class="space-y-3">
                <template x-for="bill in attentionRooms" :key="bill.room_id">
                    <div class="flex items-center gap-3 p-3 bg-red-50 rounded-xl border border-red-100">
                        <div class="w-9 h-9 rounded-lg flex items-center justify-center text-white text-xs font-bold shrink-0"
                             :class="getFloorBg(bill.room_number)" x-text="bill.room_number"></div>
                        <div class="flex-1 min-w-0">
                            <p class="font-semibold text-gray-800 text-sm truncate" x-text="bill.contact_info || '—'"></p>
                            <p class="text-xs text-gray-400" x-text="formatMoney(bill.total)"></p>
                        </div>
                        <button @click="quickCollect(bill)"
                                class="px-3 py-1.5 bg-green-600 hover:bg-green-700 text-white text-xs font-bold rounded-lg transition shrink-0" x-text="t.collect"></button>
                    </div>
                </template>
            </div>
            <template x-if="stats.unpaidCount > 3">
                <button @click="activeTab = 'bills'"
                        class="mt-3 w-full text-center text-sm text-blue-600 font-semibold hover:underline"
                        x-text="t.viewAll + ' ' + stats.unpaidCount + ' →'"></button>
            </template>
        </div>

        <!-- Recent activity -->
        <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-5">
            <h3 class="font-bold text-gray-800 mb-4" x-text="t.activityTitle"></h3>
            <template x-if="recentActivity.length === 0">
                <div class="py-8 text-center text-gray-300 text-sm" x-text="t.noActivity"></div>
            </template>
            <div class="space-y-3">
                <template x-for="(act, i) in recentActivity" :key="i">
                    <div class="flex items-center gap-3">
                        <div class="w-2 h-2 rounded-full shrink-0"
                             :class="act.type === 'paid' ? 'bg-green-500' : act.type === 'prepaid' ? 'bg-blue-500' : 'bg-amber-400'"></div>
                        <div class="flex-1 min-w-0">
                            <p class="text-sm text-gray-700">
                                <b x-text="'P.' + act.room"></b>
                                <span x-text="' ' + (act.type === 'paid' ? t.actPaid : t.actPrepaid)"></span>
                                <b class="text-blue-600" x-text="' ' + formatMoney(act.amount)"></b>
                            </p>
                        </div>
                        <span class="text-xs text-gray-400 shrink-0" x-text="act.when"></span>
                    </div>
                </template>
            </div>
        </div>
    </div>
</div>
