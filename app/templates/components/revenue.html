<!-- ═══════════════════════════════════════
     TAB: REVENUE
═══════════════════════════════════════ -->
<div x-show="activeTab === 'revenue'" class="space-y-6">
    <div class="section-header">
        <h2 class="section-title" x-text="t.revenueTitle"></h2>
    </div>

    <!-- Mini bar chart -->
    <div class="card-static p-5" x-show="revenueSummary.length > 0">
        <h3 class="font-display font-bold mb-4" x-text="t.chartTitle"></h3>
        <div class="flex items-end gap-2 h-32 border-b pb-1" style="border-color: var(--color-border)">
            <template x-for="bar in revChartData" :key="bar.label">
                <div class="flex flex-col items-center justify-end gap-1 flex-1 h-full">
                    <span class="text-xs"
                          :style="bar.current
                              ? 'color: var(--color-chart-primary)'
                              : 'color: var(--color-text-tertiary)'"
                          x-text="(bar.v/1e6).toFixed(0)+'M'"></span>
                    <div class="w-full rounded-t-lg bar-segment"
                         :style="'height:' + Math.max(bar.pct, 4) + '%; background:' + (bar.current ? 'var(--color-chart-primary)' : 'rgba(37,99,235,0.35)')"></div>
                    <span class="text-xs font-semibold"
                          :style="bar.current
                              ? 'color: var(--color-chart-primary)'
                              : 'color: var(--color-text-tertiary)'"
                          x-text="bar.label"></span>
                </div>
            </template>
        </div>
    </div>

    <!-- Revenue table -->
    <div class="card-static overflow-hidden">
        <table class="w-full text-sm">
            <thead class="border-b" style="background: var(--color-surface-raised)">
                <tr>
                    <th class="th-cell px-5 py-3 text-left" x-text="t.revMonth"></th>
                    <th class="th-cell px-5 py-3 text-right" x-text="t.electricityFee"></th>
                    <th class="th-cell px-5 py-3 text-right" x-text="t.serviceFee"></th>
                    <th class="th-cell px-5 py-3 text-right" x-text="t.rentFee"></th>
                    <th class="th-cell px-5 py-3 text-right" x-text="t.totalAmount"></th>
                </tr>
            </thead>
            <tbody class="divide-y table-divider">
                <template x-for="row in revenueSummary" :key="row.month + '-' + row.year">
                    <tr class="table-row-hover transition-colors">
                        <td class="px-5 py-4 font-bold text-lg"
                            style="color: var(--color-text-primary)"
                            x-text="row.month + '/' + row.year"></td>
                        <td class="px-5 py-4 text-right font-semibold"
                            style="color: var(--amber-600)"
                            x-text="formatMoney(row.total_elec)"></td>
                        <td class="px-5 py-4 text-right font-semibold"
                            style="color: var(--color-text-secondary)"
                            x-text="formatMoney(row.total_service)"></td>
                        <td class="px-5 py-4 text-right font-semibold"
                            style="color: var(--color-primary)"
                            x-text="formatMoney(row.total_rent)"></td>
                        <td class="px-5 py-4 text-right font-extrabold text-lg"
                            style="color: var(--color-primary)"
                            x-text="formatMoney(row.total_revenue)"></td>
                    </tr>
                </template>
            </tbody>
        </table>
        <template x-if="revenueSummary.length === 0">
            <div class="empty-state">
                <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
                     class="empty-state__icon">
                    <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/>
                    <line x1="6" y1="20" x2="6" y2="14"/>
                </svg>
                <p class="empty-state__text" x-text="t.noRevData"></p>
            </div>
        </template>
    </div>
</div>
