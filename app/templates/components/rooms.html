<!-- ═══════════════════════════════════════
     TAB: ROOMS
═══════════════════════════════════════ -->
<div x-show="activeTab === 'rooms'" class="space-y-4">
    <!-- Sub-header -->
    <div class="card-static px-5 py-3 flex flex-wrap gap-3 items-center">
        <h2 class="font-bold text-gray-800">
            <b style="color: var(--color-primary)" x-text="rooms.length"></b>
            <span x-text="' ' + t.roomsSubtitle"></span>
        </h2>
        <div class="flex-1"></div>
        <input x-model="searchQuery" :placeholder="t.search" class="input-base w-52">
    </div>

    <!-- Floors -->
    <template x-for="floor in floorGroups" :key="floor.num">
        <div>
            <div class="floor-row">
                <h3 class="floor-row__label" x-text="t.floor + ' ' + floor.num"></h3>
                <div class="floor-row__line"></div>
                <span class="floor-row__count"
                      x-text="floor.occupied + '/' + floor.total + ' ' + t.statOccupied"></span>
            </div>
            <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4">
                <template x-for="room in floor.rooms" :key="room.id">
                    <div class="card-base p-4 cursor-pointer"
                         :class="!room.is_occupied ? 'room-card--vacant' : ''"
                         :style="room.is_occupied ? 'border-color: rgba(124, 58, 237, 0.12)' : ''"
                         @click="openRoomEdit(room)">
                        <!-- Room number + status badge -->
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-2xl font-extrabold"
                                  :class="getFloorText(room.room_number)"
                                  x-text="room.room_number"></span>
                            <span class="badge"
                                  :class="getBillForRoom(room)
                                      ? (getBillForRoom(room).status==='paid' ? 'badge--paid'
                                          : getBillForRoom(room).status==='prepaid' ? 'badge--prepaid'
                                          : 'badge--unpaid')
                                      : 'badge--neutral'"
                                  x-text="getBillForRoom(room)
                                      ? (t.status_map[getBillForRoom(room).status] || '')
                                      : t.status_map.empty"></span>
                        </div>
                        <!-- Tenant -->
                        <div class="mb-3 min-h-[2.5rem]">
                            <p class="font-semibold text-sm truncate"
                               style="color: var(--color-text-primary)"
                               x-text="room.contact_info || t.status_map.empty"></p>
                            <p class="text-xs" x-show="room.is_occupied"
                               style="color: var(--color-text-secondary)"
                               x-text="formatMoney(room.rent_price) + '/th'"></p>
                        </div>
                        <!-- Bill total row -->
                        <template x-if="getBillForRoom(room) && room.is_occupied">
                            <div>
                                <div class="flex justify-between text-xs mb-2">
                                    <span x-text="'T' + month"
                                          style="color: var(--color-text-secondary)"></span>
                                    <span class="font-bold"
                                          style="color: var(--color-text-primary)"
                                          x-text="formatMoney(getBillForRoom(room).total)"></span>
                                </div>
                                <!-- Electricity mini row -->
                                <div class="flex items-center gap-1.5 rounded-sm px-2 py-1 text-xs bg-gray-100"
                                     x-show="!getBillForRoom(room).is_fixed">
                                    <span style="color: var(--color-text-tertiary)"
                                          x-text="getBillForRoom(room).old_reading"></span>
                                    <span class="text-xs" style="color: var(--color-text-tertiary)">→</span>
                                    <input type="number" :value="getBillForRoom(room).new_reading"
                                           @click.stop
                                           @change.stop="updateElectricityByRoom(room, $event.target.value)"
                                           class="w-14 bg-transparent font-bold outline-none text-center"
                                           style="color: var(--color-primary)" />
                                    <span style="color: var(--color-text-tertiary)">|</span>
                                    <span class="font-semibold"
                                          style="color: var(--blue-500)"
                                          x-text="(getBillForRoom(room).new_reading - getBillForRoom(room).old_reading) + 'kWh'"></span>
                                </div>
                                <!-- Quick actions -->
                                <div class="flex gap-2 mt-2">
                                    <template x-if="getBillForRoom(room).status === 'unpaid'">
                                        <button @click.stop="quickCollect(getBillForRoom(room))"
                                                class="btn btn--success flex-1 text-xs py-1.5"
                                                x-text="t.collect"></button>
                                    </template>
                                    <button @click.stop="showQR(getBillForRoom(room))"
                                            class="w-8 h-8 flex items-center justify-center rounded-md text-sm bg-gray-100 hover:bg-gray-200 transition-colors shrink-0">▣</button>
                                </div>
                            </div>
                        </template>
                        <template x-if="!room.is_occupied">
                            <div class="text-center mt-2">
                                <span class="badge badge--neutral" style="border-style: dashed"
                                      x-text="t.vacantRoom"></span>
                            </div>
                        </template>
                    </div>
                </template>
            </div>
        </div>
    </template>
</div>
