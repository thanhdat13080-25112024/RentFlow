<!-- ═══════════════════════════════════════
     TAB: ROOMS & BILLS (merged)
═══════════════════════════════════════ -->
<div x-show="activeTab === 'rooms'" class="space-y-4">
    <!-- ── Floor view ── -->
    <div x-show="roomView === 'floor'"
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0 translate-y-1"
         x-transition:enter-end="opacity-100 translate-y-0"
         class="space-y-4">
    <template x-for="floor in floorGroups" :key="floor.num">
        <div>
            <div class="floor-row">
                <h3 class="floor-row__label" x-text="t.floor + ' ' + floor.num"></h3>
                <div class="floor-row__line"></div>
                <span class="floor-row__count"
                      x-text="floor.occupied + '/' + floor.total + ' ' + t.statOccupied"></span>
            </div>
            <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4">
                <template x-for="(room, ri) in floor.rooms" :key="room.id">
                    <div class="card-base p-4 cursor-pointer fade-in-up"
                         :class="!room.is_occupied ? 'room-card--vacant' : ''"
                         :style="(getBillForRoom(room)
                             ? (getBillForRoom(room).status==='paid'    ? 'border-color:rgba(22,163,74,0.30)'
                             : getBillForRoom(room).status==='prepaid' ? 'border-color:rgba(124,58,237,0.32)'
                             :                                            'border-color:rgba(220,38,38,0.28)')
                             : '') + ';animation-delay:' + (ri * 40) + 'ms'"
                         @click="openRoomEdit(room)">
                        <!-- Room number + status badge -->
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-2xl font-extrabold"
                                  :class="getFloorText(room.room_number)"
                                  x-text="room.room_number"></span>
                            <span class="badge"
                                  :class="!room.is_occupied
                                      ? 'badge--neutral'
                                      : (getBillForRoom(room)
                                          ? (getBillForRoom(room).status==='paid' ? 'badge--paid'
                                              : getBillForRoom(room).status==='prepaid' ? 'badge--prepaid'
                                              : 'badge--unpaid')
                                          : 'badge--neutral')"
                                  x-text="!room.is_occupied
                                      ? t.status_map.empty
                                      : (getBillForRoom(room)
                                          ? (t.status_map[getBillForRoom(room).status] || '')
                                          : t.status_map.empty)"></span>
                        </div>
                        <!-- Tenant -->
                        <div class="mb-3 min-h-[2.5rem]">
                            <p class="font-semibold text-sm truncate"
                               style="color: var(--color-text-primary)"
                               x-text="room.contact_info || t.status_map.empty"></p>
                            <p class="text-xs" x-show="room.is_occupied"
                               style="color: var(--color-text-secondary)"
                               x-text="formatMoney(room.rent_price) + '/th'"></p>
                        </div>
                        <!-- Bill total row -->
                        <template x-if="getBillForRoom(room) && room.is_occupied">
                            <div>
                                <div class="flex justify-between text-xs mb-2">
                                    <span x-text="'T' + month"
                                          style="color: var(--color-text-secondary)"></span>
                                    <span class="font-bold"
                                          style="color: var(--color-text-primary)"
                                          x-text="formatMoney(getBillForRoom(room).total)"></span>
                                </div>
                                <!-- Electricity mini row -->
                                <div class="flex items-center gap-1.5 rounded-lg px-2.5 py-1.5 text-xs"
                                     style="background: var(--color-primary-light); border: 1px solid var(--color-primary-muted)">
                                    <!-- Old → New readings -->
                                    <div class="flex items-center gap-1 flex-1 min-w-0">
                                        <span class="tabular-nums" style="color: var(--color-text-tertiary)"
                                              x-text="getBillForRoom(room).old_reading"></span>
                                        <span style="color: var(--color-primary-muted); font-size: 0.65rem; line-height: 1; flex-shrink: 0">→</span>
                                        <input type="number" :value="getBillForRoom(room).new_reading"
                                               @click.stop
                                               @change.stop="updateElectricityByRoom(room, $event.target.value)"
                                               :disabled="getBillForRoom(room).status !== 'unpaid'"
                                               class="elec-input w-12 px-1 py-0.5 text-xs disabled:opacity-50" />
                                    </div>
                                    <!-- Divider -->
                                    <div class="w-px h-3 shrink-0" style="background: var(--color-primary); opacity: 0.2"></div>
                                    <!-- kWh with lightning bolt -->
                                    <div class="flex items-center gap-0.5 font-bold shrink-0" style="color: var(--cyan-500)">
                                        <svg width="9" height="9" viewBox="0 0 24 24" fill="currentColor" style="flex-shrink:0">
                                            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
                                        </svg>
                                        <span class="tabular-nums" x-text="(getBillForRoom(room).new_reading - getBillForRoom(room).old_reading)"></span>
                                        <span class="font-normal" style="font-size: 0.6rem; opacity: 0.75">kWh</span>
                                    </div>
                                </div>
                                <!-- Quick actions -->
                                <div class="flex items-center justify-between gap-2 mt-3">
                                    <template x-if="getBillForRoom(room).status === 'unpaid'">
                                        <button @click.stop="quickCollect(getBillForRoom(room))"
                                                class="btn btn--success flex-1 h-8 text-xs leading-none"
                                                x-text="t.collect"></button>
                                    </template>
                                    <button @click.stop="showQR(getBillForRoom(room))"
                                            class="btn-icon-ghost ml-auto w-8 h-8 flex items-center justify-center shrink-0">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none"
                                             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <rect width="5" height="5" x="3" y="3" rx="1"/>
                                            <rect width="5" height="5" x="16" y="3" rx="1"/>
                                            <rect width="5" height="5" x="3" y="16" rx="1"/>
                                            <path d="M21 16h-3a2 2 0 0 0-2 2v3"/>
                                            <path d="M21 21v.01"/>
                                            <path d="M12 7v3a2 2 0 0 1-2 2H7"/>
                                            <path d="M3 12h.01"/>
                                            <path d="M12 3h.01"/>
                                            <path d="M12 16v.01"/>
                                            <path d="M16 12h1"/>
                                            <path d="M21 12v.01"/>
                                            <path d="M12 21v-1"/>
                                        </svg>
                                    </button>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>
            </div>
        </div>
    </template>
    </div><!-- end floor view -->
</div>
