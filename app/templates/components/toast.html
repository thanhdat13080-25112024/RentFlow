<!-- ── TOAST ── -->
<div x-show="toast.show" x-cloak
     x-transition:enter="transition ease-out duration-200"
     x-transition:enter-start="opacity-0 -translate-y-2"
     x-transition:enter-end="opacity-100 translate-y-0"
     x-transition:leave="transition ease-in duration-150"
     x-transition:leave-start="opacity-100 translate-y-0"
     x-transition:leave-end="opacity-0 -translate-y-2"
     class="fixed top-4 right-4 z-[2000] pointer-events-none">
    <div class="flex items-center gap-3 px-5 py-3 rounded-xl shadow-xl border text-sm font-semibold"
         :style="toast.type==='error'
             ? 'background: rgba(185,28,28,0.92); border-color: rgba(239,68,68,0.50); color: #fca5a5; backdrop-filter: blur(20px); box-shadow: 0 8px 32px rgba(185,28,28,0.40), 0 1px 0 rgba(255,255,255,0.12) inset'
             : 'background: rgba(21,128,61,0.90); border-color: rgba(34,197,94,0.50); color: #86efac; backdrop-filter: blur(20px); box-shadow: 0 8px 32px rgba(21,128,61,0.38), 0 1px 0 rgba(255,255,255,0.12) inset'">
        <i class="fas" :class="(toast.type==='error' ? 'fa-circle-exclamation' : 'fa-circle-check') + (toast.show ? ' toast-pop' : '')"></i>
        <span x-text="toast.message"></span>
    </div>
</div>
