<!-- ── MODAL: EDIT ROOM ── -->
<div x-show="editRoomModal.show" x-cloak
     class="fixed inset-0 z-[80] flex items-center justify-center bg-black/50 px-4 backdrop-blur-sm">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-xl overflow-hidden slide-up">
        <div class="px-6 py-5 border-b flex items-center justify-between bg-gray-50">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl flex items-center justify-center text-white font-bold text-sm"
                     :class="getFloorBg(editRoomModal.room.room_number)">
                    <span x-text="editRoomModal.room.room_number"></span>
                </div>
                <div>
                    <h3 class="font-bold text-gray-800" x-text="t.editRoom"></h3>
                    <p class="text-xs text-gray-400" x-text="t.dataMonth + ' ' + month + '/' + year"></p>
                </div>
            </div>
            <button @click="editRoomModal.show = false" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-gray-100 text-gray-400 hover:text-gray-600 transition">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="p-6 space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="text-xs font-semibold text-gray-500 uppercase tracking-wide block mb-1.5" x-text="t.rentFee"></label>
                    <input type="text" :value="formatInput(editRoomModal.room.rent_price)"
                           @input="editRoomModal.room.rent_price = parseInput($event.target.value)"
                           @blur="fixMoney(editRoomModal.room, 'rent_price')"
                           class="w-full border border-gray-200 rounded-lg px-3 py-2.5 font-semibold text-gray-800 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                </div>
                <div>
                    <label class="text-xs font-semibold text-gray-500 uppercase tracking-wide block mb-1.5" x-text="t.serviceFee"></label>
                    <input type="text" :value="formatInput(editRoomModal.room.service_fee)"
                           @input="editRoomModal.room.service_fee = parseInput($event.target.value)"
                           @blur="fixMoney(editRoomModal.room, 'service_fee')"
                           class="w-full border border-gray-200 rounded-lg px-3 py-2.5 font-semibold text-gray-800 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                </div>
                <div>
                    <label class="text-xs font-semibold text-gray-500 uppercase tracking-wide block mb-1.5" x-text="t.depositLabel"></label>
                    <input type="text" :value="formatInput(editRoomModal.room.deposit)"
                           @input="editRoomModal.room.deposit = parseInput($event.target.value)"
                           @blur="fixMoney(editRoomModal.room, 'deposit')"
                           class="w-full border border-gray-200 rounded-lg px-3 py-2.5 font-semibold text-gray-800 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                </div>
                <div>
                    <label class="text-xs font-semibold text-gray-500 uppercase tracking-wide block mb-1.5" x-text="t.moveInDate"></label>
                    <input type="text" :value="editRoomModal.room.move_in_date"
                           @input="editRoomModal.room.move_in_date = formatDate($event.target.value)"
                           @blur="fixDate(editRoomModal.room)"
                           placeholder="DD/MM/YYYY"
                           class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-gray-800 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                </div>
                <div x-show="roomHistory.records && roomHistory.records.length > 0 && month === roomHistory.records[roomHistory.records.length-1].month && year === roomHistory.records[roomHistory.records.length-1].year" class="col-span-2">
                    <label class="text-xs font-semibold text-gray-500 uppercase tracking-wide block mb-1.5" x-text="t.initialReading"></label>
                    <input type="number" x-model.number="editRoomModal.room.old_reading"
                           class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-blue-600 font-semibold focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                </div>
            </div>
            <div>
                <label class="text-xs font-semibold text-gray-500 uppercase tracking-wide block mb-1.5" x-text="t.contactInfo"></label>
                <input type="text" x-model="editRoomModal.room.contact_info"
                       :placeholder="t.contactInfo"
                       class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-gray-800 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
            </div>
        </div>
        <div class="px-6 py-4 bg-gray-50 border-t flex gap-3">
            <button @click="showHistory(editRoomModal.room)"
                    class="px-4 py-2.5 rounded-lg border border-gray-200 bg-white text-gray-600 hover:bg-gray-100 text-sm font-semibold transition flex items-center gap-2">
                <i class="fas fa-clock-rotate-left"></i> <span x-text="t.history"></span>
            </button>
            <button @click="saveQuickEdit()"
                    class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-lg font-semibold text-sm transition" x-text="t.saveChanges"></button>
        </div>
    </div>
</div>

<!-- ── MODAL: ROOM HISTORY ── -->
<div x-show="roomHistory.show" x-cloak
     class="fixed inset-0 z-[90] flex items-center justify-center bg-black/50 px-4 backdrop-blur-sm">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-4xl max-h-[85vh] flex flex-col slide-up">
        <div class="px-6 py-5 border-b flex items-center justify-between">
            <div>
                <h3 class="font-bold text-gray-800 text-lg">
                    <span x-text="t.historyTitle"></span> <span class="text-blue-600" x-text="roomHistory.room_number"></span>
                </h3>
                <p class="text-xs text-gray-400 mt-0.5" x-text="t.historySubtitle"></p>
            </div>
            <button @click="roomHistory.show = false" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-gray-100 text-gray-400 transition">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="flex-1 overflow-y-auto">
            <table class="w-full text-sm">
                <thead class="sticky top-0 bg-gray-50 border-b">
                    <tr class="text-xs font-semibold text-gray-500 uppercase tracking-wide">
                        <th class="px-4 py-3 text-left" x-text="t.period"></th>
                        <th class="px-4 py-3 text-left" x-text="t.tenant"></th>
                        <th class="px-4 py-3 text-right" x-text="t.rentFee"></th>
                        <th class="px-4 py-3 text-center" x-text="t.electricity"></th>
                        <th class="px-4 py-3 text-right" x-text="t.total"></th>
                        <th class="px-4 py-3 text-center" x-text="t.status"></th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-50">
                    <template x-for="rec in roomHistory.records" :key="rec.month + '-' + rec.year">
                        <tr class="hover:bg-gray-50 transition-colors">
                            <td class="px-4 py-3 font-semibold text-gray-800" x-text="rec.month + '/' + rec.year"></td>
                            <td class="px-4 py-3 text-gray-600" x-text="rec.tenant_name || '—'"></td>
                            <td class="px-4 py-3 text-right text-gray-600" x-text="formatMoney(rec.rent_fee)"></td>
                            <td class="px-4 py-3 text-center text-gray-500 text-xs">
                                <span x-text="rec.old_reading"></span>
                                <i class="fas fa-arrow-right mx-1 text-gray-300"></i>
                                <span class="text-blue-600 font-semibold" x-text="rec.new_reading"></span>
                                <span class="text-gray-400 ml-1" x-text="'(' + rec.usage + ' kWh)'"></span>
                            </td>
                            <td class="px-4 py-3 text-right font-semibold text-gray-800" x-text="formatMoney(rec.total)"></td>
                            <td class="px-4 py-3 text-center">
                                <span class="px-2 py-1 rounded-full text-xs font-semibold"
                                      :class="rec.status==='paid' ? 'bg-green-100 text-green-700' : rec.status==='prepaid' ? 'bg-blue-100 text-blue-700' : 'bg-red-100 text-red-700'"
                                      x-text="t.status_map[rec.status] || rec.status"></span>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
            <template x-if="roomHistory.records.length === 0">
                <div class="py-16 text-center text-gray-400">
                    <i class="fas fa-folder-open text-4xl mb-3 block text-gray-200"></i>
                    <span x-text="t.noHistory"></span>
                </div>
            </template>
        </div>
    </div>
</div>

<!-- ── MODAL: QR / INVOICE ── -->
<div x-show="qrModal.show" x-cloak
     class="fixed inset-0 z-[80] flex items-center justify-center bg-black/60 px-4 backdrop-blur-sm">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl overflow-hidden slide-up">
        <div id="invoice-content" class="p-8 bg-white">
            <div class="flex justify-between items-start mb-8 pb-6 border-b-2 border-blue-50">
                <div>
                    <h2 class="text-3xl font-extrabold text-blue-900 mb-2 tracking-tight" x-text="t.invoiceTitle"></h2>
                    <div class="flex items-center gap-3">
                        <span class="bg-blue-600 text-white px-3 py-1 rounded-lg text-xs font-bold">
                            <span x-text="t.month + ' ' + month + ' / ' + year"></span>
                        </span>
                        <span class="text-gray-500 font-semibold">
                            <span x-text="t.room + ': '"></span>
                            <span class="text-blue-600 font-bold text-xl" x-text="qrModal.room"></span>
                        </span>
                    </div>
                </div>
                <div class="bg-blue-50 px-5 py-3 rounded-xl text-right border border-blue-100">
                    <p class="text-xs font-bold text-blue-500 uppercase tracking-wider mb-1" x-text="settings.bank_name"></p>
                    <p class="text-lg font-extrabold text-gray-800" x-text="settings.bank_account"></p>
                    <p class="text-xs text-gray-500 font-semibold" x-text="settings.account_holder"></p>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-8 items-start">
                <div class="space-y-3">
                    <div class="bg-gray-50 rounded-xl p-5 border border-gray-100 space-y-3">
                        <div class="flex justify-between items-center pb-2 border-b border-gray-100">
                            <span class="text-xs font-semibold text-gray-500 uppercase tracking-wide" x-text="t.rentFee"></span>
                            <span class="font-bold text-gray-800" x-text="formatMoney(qrModal.rent_fee)"></span>
                        </div>
                        <div class="flex justify-between items-center pb-2 border-b border-gray-100">
                            <span class="text-xs font-semibold text-gray-500 uppercase tracking-wide" x-text="t.serviceFee"></span>
                            <span class="font-bold text-gray-800" x-text="formatMoney(qrModal.service_fee)"></span>
                        </div>
                        <div class="flex justify-between items-center pb-2 border-b border-gray-100">
                            <div>
                                <span class="text-xs font-semibold text-gray-500 uppercase tracking-wide" x-text="t.electricityFee"></span>
                                <p class="text-xs text-blue-400 font-semibold mt-0.5">
                                    <span x-text="t.usage + ': ' + qrModal.elec_usage + ' kWh'"></span>
                                </p>
                            </div>
                            <span class="font-bold text-gray-800" x-text="formatMoney(qrModal.elec_fee)"></span>
                        </div>
                        <div class="bg-blue-600 rounded-xl px-4 py-4 flex justify-between items-center mt-2">
                            <p class="text-xs font-bold text-blue-200 uppercase tracking-wider" x-text="t.totalAmount"></p>
                            <p class="text-2xl font-extrabold text-white" x-text="formatMoney(qrModal.amount)"></p>
                        </div>
                    </div>
                </div>
                <div class="flex flex-col items-center gap-4">
                    <div class="p-3 bg-white rounded-2xl shadow-lg border border-gray-100">
                        <img :src="getQRUrl()" alt="QR" class="w-48 h-48 rounded-xl" crossorigin="anonymous">
                    </div>
                    <div class="text-center w-full">
                        <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2" x-text="t.transferContent"></p>
                        <div class="bg-gray-100 px-4 py-3 rounded-xl border-2 border-dashed border-gray-200">
                            <p class="font-extrabold text-blue-700 tracking-widest text-sm"
                               x-text="'PHONG ' + qrModal.room + ' THANG ' + month"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="px-6 py-4 bg-gray-50 border-t flex gap-3 justify-center">
            <button @click="saveInvoiceAsImage()"
                    class="bg-green-600 hover:bg-green-700 text-white px-6 py-2.5 rounded-lg font-semibold text-sm flex items-center gap-2 transition">
                <i class="fas fa-download"></i> <span x-text="t.downloadInvoice"></span>
            </button>
            <button @click="qrModal.show = false"
                    class="bg-gray-800 hover:bg-black text-white px-6 py-2.5 rounded-lg font-semibold text-sm transition" x-text="t.close"></button>
        </div>
    </div>
</div>

<!-- ── MODAL: PREPAID ── -->
<div x-show="prepaidModal.show" x-cloak
     class="fixed inset-0 z-[90] flex items-center justify-center bg-black/50 px-4 backdrop-blur-sm">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-6 slide-up">
        <div class="flex items-center gap-3 mb-4">
            <div class="w-10 h-10 bg-blue-100 text-blue-600 rounded-xl flex items-center justify-center">
                <i class="fas fa-calendar-check"></i>
            </div>
            <h3 class="font-bold text-gray-800" x-text="t.prepaidTitle"></h3>
        </div>
        <p class="text-sm text-gray-500 mb-3">
            <span x-text="t.prepaidHint"></span>
            <span class="text-blue-600 font-bold" x-text="prepaidModal.room_number"></span>:
        </p>
        <input type="text" x-model="prepaidModal.months" autofocus
               placeholder="6, 7, 8"
               class="w-full border-2 border-gray-100 rounded-xl px-4 py-3 font-bold text-xl text-blue-600 mb-5 focus:border-blue-400 outline-none transition">
        <div class="flex gap-3">
            <button @click="confirmPrepaid()"
                    class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-semibold transition" x-text="t.confirm"></button>
            <button @click="prepaidModal.show = false"
                    class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 py-3 rounded-xl font-semibold transition" x-text="t.cancel"></button>
        </div>
    </div>
</div>

<!-- ── MODAL: CONFIRM ── -->
<div x-show="confirmModal.show" x-cloak
     class="fixed inset-0 z-[90] flex items-center justify-center bg-black/50 px-4 backdrop-blur-sm">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-6 text-center slide-up">
        <div class="w-14 h-14 bg-amber-100 text-amber-500 rounded-2xl flex items-center justify-center text-2xl mx-auto mb-4">
            <i class="fas fa-triangle-exclamation"></i>
        </div>
        <h3 class="font-bold text-gray-800 text-lg mb-2" x-text="confirmModal.title"></h3>
        <p class="text-sm text-gray-400 mb-6" x-text="confirmModal.message"></p>
        <div class="flex gap-3">
            <button @click="confirmModal.callback(); confirmModal.show = false"
                    class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-semibold transition" x-text="t.confirm"></button>
            <button @click="confirmModal.show = false"
                    class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 py-3 rounded-xl font-semibold transition" x-text="t.cancel"></button>
        </div>
    </div>
</div>
