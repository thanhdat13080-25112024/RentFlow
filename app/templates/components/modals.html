<!-- ── MODAL: EDIT ROOM ── -->
<div x-show="editRoomModal.show" x-cloak
     class="fixed inset-0 h-full w-full z-[1000] flex items-center justify-center px-4"
     style="background: rgba(15,10,40,0.50); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px)">
    <div class="card-static w-full max-w-xl overflow-hidden slide-up">
        <div class="px-6 py-5 border-b flex items-center justify-between"
             style="background: var(--color-primary-light); border-color: var(--color-primary-muted)">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl flex items-center justify-center text-white font-bold text-sm"
                     :class="getFloorBg(editRoomModal.room.room_number)">
                    <span x-text="editRoomModal.room.room_number"></span>
                </div>
                <div>
                    <h3 class="font-bold" style="color: var(--color-text-primary)" x-text="t.editRoom"></h3>
                    <p class="text-xs" style="color: var(--color-text-secondary)" x-text="t.dataMonth + ' ' + month + '/' + year"></p>
                </div>
            </div>
            <button @click="editRoomModal.show = false"
                    class="w-8 h-8 flex items-center justify-center rounded-md hover:bg-gray-100 transition-colors" style="color: var(--color-text-tertiary)">✕</button>
        </div>
        <div class="p-6 space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="th-cell block mb-1.5" x-text="t.rentFee"></label>
                    <input type="text" :value="formatInput(editRoomModal.room.rent_price)"
                           @input="editRoomModal.room.rent_price = parseInput($event.target.value)"
                           @blur="fixMoney(editRoomModal.room, 'rent_price')"
                           class="input-base">
                </div>
                <div>
                    <label class="th-cell block mb-1.5" x-text="t.serviceFee"></label>
                    <input type="text" :value="formatInput(editRoomModal.room.service_fee)"
                           @input="editRoomModal.room.service_fee = parseInput($event.target.value)"
                           @blur="fixMoney(editRoomModal.room, 'service_fee')"
                           class="input-base">
                </div>
                <div>
                    <label class="th-cell block mb-1.5" x-text="t.depositLabel"></label>
                    <input type="text" :value="formatInput(editRoomModal.room.deposit)"
                           @input="editRoomModal.room.deposit = parseInput($event.target.value)"
                           @blur="fixMoney(editRoomModal.room, 'deposit')"
                           class="input-base">
                </div>
                <div>
                    <label class="th-cell block mb-1.5" x-text="t.moveInDate"></label>
                    <input type="text" :value="editRoomModal.room.move_in_date"
                           @input="editRoomModal.room.move_in_date = formatDate($event.target.value)"
                           @blur="fixDate(editRoomModal.room)"
                           placeholder="DD/MM/YYYY"
                           class="input-base">
                </div>
                <div x-show="!editRoomModal.room.is_occupied"
                     class="col-span-2">
                    <label class="th-cell block mb-1.5" x-text="t.initialReading"></label>
                    <input type="number" x-model.number="editRoomModal.room.old_reading" class="input-base"
                           style="color: var(--color-primary)">
                    <p class="text-xs text-gray-400 mt-1 italic">(*) Chỉ cần thiết khi bắt đầu cho thuê mới</p>
                </div>
            </div>
            <div>
                <label class="th-cell block mb-1.5" x-text="t.contactInfo"></label>
                <input type="text" x-model="editRoomModal.room.contact_info"
                       :placeholder="t.contactInfo" class="input-base">
            </div>
        </div>
        <div class="px-6 py-4 border-t flex gap-3"
             style="background: var(--color-primary-light); border-color: var(--color-primary-muted)">
            <button @click="showHistory(editRoomModal.room)" class="btn btn--ghost">
                ⟳ <span x-text="t.history"></span>
            </button>
            <button x-show="editRoomModal.room.is_occupied"
                    @click="moveOut(editRoomModal.room)" class="btn btn--ghost"
                    style="color: var(--color-unpaid)"
                    x-text="t.moveOut"></button>
            <button @click="saveQuickEdit()" class="btn btn--primary flex-1"
                    x-text="t.saveChanges"></button>
        </div>
    </div>
</div>

<!-- ── MODAL: ROOM HISTORY ── -->
<div x-show="roomHistory.show" x-cloak
     class="fixed inset-0 h-full w-full z-[1000] flex items-center justify-center px-4"
     style="background: rgba(15,10,40,0.50); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px)">
    <div class="card-static w-full max-w-4xl max-h-[85vh] flex flex-col slide-up">
        <div class="px-6 py-5 border-b flex items-center justify-between"
             style="border-color: var(--color-border)">
            <div>
                <h3 class="font-bold text-lg" style="color: var(--color-text-primary)">
                    <span x-text="t.historyTitle"></span>
                    <span style="color: var(--color-primary)" x-text="roomHistory.room_number"></span>
                </h3>
                <p class="text-xs text-gray-400 mt-0.5" x-text="t.historySubtitle"></p>
            </div>
            <button @click="roomHistory.show = false"
                    class="w-8 h-8 flex items-center justify-center rounded-md hover:bg-gray-100 transition-colors" style="color: var(--color-text-tertiary)">✕</button>
        </div>
        <div class="flex-1 overflow-y-auto">
            <table class="w-full text-sm">
                <thead class="sticky top-0 border-b table-head-dark">
                    <tr>
                        <th class="th-cell px-4 py-3 text-left" x-text="t.period"></th>
                        <th class="th-cell px-4 py-3 text-left" x-text="t.tenant"></th>
                        <th class="th-cell px-4 py-3 text-right" x-text="t.rentFee"></th>
                        <th class="th-cell px-4 py-3 text-center" x-text="t.electricity"></th>
                        <th class="th-cell px-4 py-3 text-right" x-text="t.total"></th>
                        <th class="th-cell px-4 py-3 text-center" x-text="t.status"></th>
                    </tr>
                </thead>
                <tbody class="divide-y table-divider">
                    <template x-for="rec in roomHistory.records" :key="rec.month + '-' + rec.year">
                        <tr class="table-row-hover transition-colors">
                            <td class="px-4 py-3 font-semibold" style="color: var(--color-text-primary)"
                                x-text="rec.month + '/' + rec.year"></td>
                            <td class="px-4 py-3" style="color: var(--color-text-secondary)" x-text="rec.tenant_name || '—'"></td>
                            <td class="px-4 py-3 text-right font-semibold" style="color: var(--color-text-secondary)"
                                x-text="formatMoney(rec.rent_fee)"></td>
                            <td class="px-4 py-3 text-center text-xs" style="color: var(--color-text-tertiary)">
                                <span x-text="rec.old_reading"></span>
                                <span class="mx-1" style="color: var(--color-border)">→</span>
                                <span class="font-semibold" style="color: var(--color-primary)"
                                      x-text="rec.new_reading"></span>
                                <span class="ml-1" style="color: var(--color-text-tertiary)"
                                      x-text="'(' + rec.usage + ' kWh)'"></span>
                            </td>
                            <td class="px-4 py-3 text-right font-semibold" style="color: var(--color-text-primary)"
                                x-text="formatMoney(rec.total)"></td>
                            <td class="px-4 py-3 text-center">
                                <span class="badge"
                                      :class="rec.status==='paid' ? 'badge--paid' : rec.status==='prepaid' ? 'badge--prepaid' : 'badge--unpaid'"
                                      x-text="t.status_map[rec.status] || rec.status"></span>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
            <template x-if="roomHistory.records.length === 0">
                <div class="empty-state">
                    <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
                         class="empty-state__icon">
                        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                    </svg>
                    <span class="empty-state__text" x-text="t.noHistory"></span>
                </div>
            </template>
        </div>
    </div>
</div>

<!-- ── MODAL: QR / INVOICE ── -->
<div x-show="qrModal.show" x-cloak
     @click.self="qrModal.show = false"
     @keydown.escape.window="qrModal.show = false"
     class="fixed inset-0 h-full w-full z-[1000] flex items-center justify-center px-4"
     style="background: rgba(15,10,40,0.60); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px)">
    <div class="card-static w-full max-w-2xl overflow-hidden slide-up flex flex-col max-h-[90vh]" style="max-width: min(90vw, 800px)">
        <!-- Close button -->
        <div class="flex items-center justify-end px-4 pt-3 pb-0 shrink-0">
            <button @click="qrModal.show = false"
                    class="w-8 h-8 flex items-center justify-center rounded-md hover:bg-gray-100 transition-colors" style="color: var(--color-text-tertiary)">✕</button>
        </div>
        <div id="invoice-content" class="p-6 sm:p-8 bg-white overflow-y-auto flex-1">
            <div class="flex flex-wrap justify-between items-start mb-8 pb-6 gap-4 border-b-2"
                 style="border-color: var(--color-primary-muted)">
                <div class="min-w-0">
                    <h2 class="font-display text-3xl font-extrabold mb-2 tracking-tight"
                        style="color: var(--violet-900)"
                        x-text="t.invoiceTitle"></h2>
                    <div class="flex items-center gap-3">
                        <span class="badge badge--prepaid">
                            <span x-text="t.month + ' ' + month + ' / ' + year"></span>
                        </span>
                        <span class="text-gray-500 font-semibold">
                            <span x-text="t.room + ': '"></span>
                            <span class="font-bold text-xl" style="color: var(--color-primary)"
                                  x-text="qrModal.room"></span>
                        </span>
                    </div>
                </div>
                <div class="px-5 py-3 rounded-xl text-right border shrink-0 max-w-[200px]"
                     style="background: var(--color-primary-light); border-color: var(--color-primary-muted)">
                    <p class="text-xs font-bold uppercase tracking-wider mb-1"
                       style="color: var(--color-primary)"
                       x-text="settings.bank_name"></p>
                    <p class="text-lg font-extrabold break-all" style="color: var(--color-text-primary)" x-text="settings.bank_account"></p>
                    <p class="text-xs text-gray-500 font-semibold break-all" x-text="settings.account_holder"></p>
                </div>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-8 items-start">
                <div class="space-y-3">
                    <div class="rounded-xl p-5 border space-y-3"
                         style="background: var(--color-primary-light); border-color: var(--color-border)">
                        <div class="flex justify-between items-center pb-2 border-b" style="border-color: var(--color-border)">
                            <span class="th-cell" x-text="t.rentFee"></span>
                            <span class="font-bold" style="color: var(--color-text-primary)"
                                  x-text="formatMoney(qrModal.rent_fee)"></span>
                        </div>
                        <div class="flex justify-between items-center pb-2 border-b" style="border-color: var(--color-border)">
                            <span class="th-cell" x-text="t.serviceFee"></span>
                            <span class="font-bold" style="color: var(--color-text-primary)"
                                  x-text="formatMoney(qrModal.service_fee)"></span>
                        </div>
                        <div class="flex justify-between items-center pb-2 border-b" style="border-color: var(--color-border)">
                            <div>
                                <span class="th-cell" x-text="t.electricityFee"></span>
                                <p class="text-xs font-semibold mt-0.5"
                                   style="color: var(--color-primary)">
                                    <span x-text="t.usage + ': ' + qrModal.elec_usage + ' kWh'"></span>
                                </p>
                            </div>
                            <span class="font-bold" style="color: var(--color-text-primary)"
                                  x-text="formatMoney(qrModal.elec_fee)"></span>
                        </div>
                        <div class="rounded-xl px-4 py-4 flex justify-between items-center mt-2"
                             style="background: var(--accent); background: linear-gradient(135deg, var(--accent), var(--accent-strong))">
                            <p class="text-xs font-bold uppercase tracking-wider"
                               style="color: rgba(255,255,255,0.85)"
                               x-text="t.totalAmount"></p>
                            <p class="text-2xl font-extrabold text-white"
                               x-text="formatMoney(qrModal.amount)"></p>
                        </div>
                    </div>
                </div>
                <div class="flex flex-col items-center gap-4">
                    <div class="p-3 rounded-2xl" style="background: rgba(255,255,255,0.96); box-shadow: var(--shadow-glass-md)">
                        <img :src="getQRUrl()" alt="QR" class="w-48 h-48 rounded-xl" crossorigin="anonymous">
                    </div>
                    <div class="text-center w-full">
                        <p class="th-cell block mb-2" x-text="t.transferContent"></p>
                        <div class="px-4 py-3 rounded-xl border-2 border-dashed"
                             style="background: var(--color-primary-light); border-color: var(--color-primary-muted)">
                            <p class="font-extrabold tracking-widest text-sm"
                               style="color: var(--violet-700)"
                               x-text="'PHONG ' + qrModal.room + ' THANG ' + month"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="px-6 py-4 border-t flex gap-3 justify-center shrink-0"
             style="background: var(--color-surface-raised); border-color: var(--color-border)">
            <button @click="saveInvoiceAsImage()" class="btn btn--success">
                ↓ <span x-text="t.downloadInvoice"></span>
            </button>
            <button @click="qrModal.show = false"
                    class="btn rounded-lg px-4 py-2 text-sm font-semibold text-white transition-colors"
                    style="background: var(--neutral-800)"
                    x-text="t.close"></button>
        </div>
    </div>
</div>

<!-- ── MODAL: PREPAID ── -->
<div x-show="prepaidModal.show" x-cloak
     class="fixed inset-0 h-full w-full z-[1000] flex items-center justify-center px-4"
     style="background: rgba(15,10,40,0.50); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px)">
    <div class="card-static w-full max-w-sm p-6 slide-up">
        <div class="flex items-center gap-3 mb-4">
            <div class="w-10 h-10 flex items-center justify-center rounded-lg shrink-0"
                 style="background: var(--color-primary-light); color: var(--color-primary)">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                    <line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/>
                    <line x1="3" y1="10" x2="21" y2="10"/>
                    <polyline points="9 16 11 18 15 14"/>
                </svg>
            </div>
            <h3 class="font-bold" style="color: var(--color-text-primary)" x-text="t.prepaidTitle"></h3>
        </div>
        <p class="text-sm text-gray-500 mb-3">
            <span x-text="t.prepaidHint"></span>
            <span class="font-bold" style="color: var(--color-primary)"
                  x-text="prepaidModal.room_number"></span>:
        </p>
        <input type="text" x-model="prepaidModal.months" autofocus
               placeholder="6, 7, 8"
               class="input-base input-base--lg mb-5 text-xl font-bold text-center"
               style="color: var(--color-primary)">
        <div class="flex gap-3">
            <button @click="confirmPrepaid()" class="btn btn--primary flex-1"
                    x-text="t.confirm"></button>
            <button @click="prepaidModal.show = false" class="btn btn--ghost flex-1"
                    x-text="t.cancel"></button>
        </div>
    </div>
</div>

<!-- ── MODAL: CONFIRM ── -->
<div x-show="confirmModal.show" x-cloak
     class="fixed inset-0 h-full w-full z-[1000] flex items-center justify-center px-4"
     style="background: rgba(15,10,40,0.50); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px)">
    <div class="card-static w-full max-w-sm p-6 text-center slide-up">
        <div class="w-14 h-14 rounded-xl flex items-center justify-center text-2xl mx-auto mb-4"
             style="background: var(--color-warning-bg); color: var(--color-warning)">
            ⚠
        </div>
        <h3 class="font-bold text-lg mb-2" style="color: var(--color-text-primary)" x-text="confirmModal.title"></h3>
        <p class="text-sm text-gray-400 mb-6" x-text="confirmModal.message"></p>
        <div class="flex gap-3">
            <button @click="confirmModal.callback(); confirmModal.show = false"
                    class="btn btn--primary flex-1"
                    x-text="t.confirm"></button>
            <button @click="confirmModal.show = false"
                    class="btn btn--ghost flex-1"
                    x-text="t.cancel"></button>
        </div>
    </div>
</div>

<!-- ── MODAL: REMIND (nhắc thu tiền) ── -->
<div x-show="remindModal.show" x-cloak
     class="fixed inset-0 h-full w-full z-[1000] flex items-center justify-center px-4"
     style="background: rgba(15,10,40,0.50); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px)">
    <div class="card-static w-full max-w-md p-6 slide-up">
        <div class="flex items-center justify-between mb-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 flex items-center justify-center rounded-lg shrink-0"
                     style="background: var(--color-warning-bg); color: var(--color-warning)">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                    </svg>
                </div>
                <div>
                    <h3 class="font-bold" style="color: var(--color-text-primary)" x-text="t.remindTitle"></h3>
                    <p class="text-xs" style="color: var(--color-text-secondary)">
                        <span x-text="'P.' + remindModal.room_number"></span>
                        <span x-show="remindModal.phone" x-text="' · ' + remindModal.phone"></span>
                    </p>
                </div>
            </div>
            <button @click="remindModal.show = false"
                    class="w-8 h-8 flex items-center justify-center rounded-md hover:bg-gray-100 transition-colors"
                    style="color: var(--color-text-tertiary)">✕</button>
        </div>
        <label class="th-cell block mb-1.5" x-text="t.remindMsgLabel"></label>
        <textarea x-model="remindModal.message" rows="5"
                  class="input-base w-full text-sm" style="resize: vertical"></textarea>
        <div class="flex gap-3 mt-5">
            <button @click="copyRemind()" class="btn btn--primary flex-1">
                ⧉ <span x-text="t.copyBtn"></span>
            </button>
            <a x-show="remindModal.phone" :href="remindSmsUrl()"
               class="btn btn--ghost flex-1 text-center"
               style="display:flex; align-items:center; justify-content:center"
               x-text="t.sendSms"></a>
        </div>
    </div>
</div>
