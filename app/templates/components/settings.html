<!-- ═══════════════════════════════════════
     TAB: SETTINGS
═══════════════════════════════════════ -->
<div x-show="activeTab === 'settings'" class="max-w-xl space-y-6">
    <div class="flex items-center justify-between">
        <h2 class="text-xl font-extrabold text-gray-800" x-text="t.settingsTitle"></h2>
        <button @click="logout()" 
                class="flex items-center gap-2 px-4 py-2 rounded-lg border border-red-200 text-red-600 hover:bg-red-50 text-sm font-semibold transition">
            <i class="fas fa-right-from-bracket"></i>
            <span>Đăng xuất</span>
        </button>
    </div>
    <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-6 space-y-5">
        <template x-for="(value, key) in settings" :key="key">
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1.5" x-text="t.settingLabels[key] || key"></label>
                <input type="text" x-model="settings[key]"
                       class="w-full border border-gray-200 rounded-lg px-4 py-3 text-gray-800 font-semibold focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
            </div>
        </template>
    </div>
    <button @click="saveSettings()"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-bold text-sm transition" x-text="t.saveChanges"></button>
</div>
