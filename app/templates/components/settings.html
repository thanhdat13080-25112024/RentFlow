<!-- ═══════════════════════════════════════
     TAB: SETTINGS
═══════════════════════════════════════ -->
<div x-show="activeTab === 'settings'" class="max-w-xl space-y-6">
    <div class="section-header">
        <h2 class="section-title" x-text="t.settingsTitle"></h2>
        <button @click="logout()" class="btn btn--danger-ghost">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <polyline points="16 17 21 12 16 7"/>
                <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            <span>Đăng xuất</span>
        </button>
    </div>

    <div class="card-static p-6 space-y-5">
        <template x-for="(value, key) in settings" :key="key">
            <div>
                <label class="th-cell block mb-1.5" x-text="t.settingLabels[key] || key"></label>
                <input type="text" x-model="settings[key]" class="input-base input-base--lg">
            </div>
        </template>
    </div>

    <button @click="saveSettings()" class="btn btn--primary btn--lg w-full" x-text="t.saveChanges"></button>
</div>
