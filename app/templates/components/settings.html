<!-- ═══════════════════════════════════════
     TAB: SETTINGS
═══════════════════════════════════════ -->
<div x-show="activeTab === 'settings'"
     x-transition:enter="transition ease-out duration-300"
     x-transition:enter-start="opacity-0 translate-y-1"
     x-transition:enter-end="opacity-100 translate-y-0"
     class="max-w-xl mx-auto space-y-6">
    <div class="section-header">
        <h2 class="section-title" x-text="t.settingsTitle"></h2>
    </div>

    <div class="card-static p-6 space-y-5">
        <template x-for="(value, key) in settings" :key="key">
            <div>
                <label class="th-cell block mb-1.5" x-text="t.settingLabels[key] || key"></label>
                <input type="text" x-model="settings[key]" class="input-base input-base--lg">
            </div>
        </template>
    </div>

    <button @click="saveSettings()" class="btn btn--primary btn--lg w-full" x-text="t.saveChanges"></button>
</div>
