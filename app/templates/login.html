<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - RentFlow</title>
    <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gray: {
              50:  'var(--neutral-50)',
              100: 'var(--neutral-100)',
              200: 'var(--neutral-200)',
              300: 'var(--neutral-300)',
              400: 'var(--neutral-400)',
              500: 'var(--neutral-500)',
              600: 'var(--neutral-600)',
              700: 'var(--neutral-700)',
              800: 'var(--neutral-800)',
              900: 'var(--neutral-900)',
            },
            violet: {
              50:  'var(--violet-50)',
              100: 'var(--violet-100)',
              200: 'var(--violet-200)',
              300: 'var(--violet-300)',
              400: 'var(--violet-400)',
              500: 'var(--violet-500)',
              600: 'var(--violet-600)',
              700: 'var(--violet-700)',
              800: 'var(--violet-800)',
              900: 'var(--violet-900)',
            },
            indigo: {
              50:  'var(--indigo-50)',
              600: 'var(--indigo-600)',
            },
            green: {
              50:  'var(--green-50)',
              600: 'var(--green-600)',
            },
            red: {
              50:  'var(--red-50)',
              100: 'var(--red-100)',
              500: 'var(--red-500)',
              600: 'var(--red-600)',
            },
          },
          fontFamily: {
            sans:    ['var(--font-body)',    'system-ui', 'sans-serif'],
            display: ['var(--font-display)', 'serif'],
          },
          borderRadius: {
            sm:    'var(--radius-sm)',
            md:    'var(--radius-md)',
            lg:    'var(--radius-lg)',
            xl:    'var(--radius-xl)',
            '2xl': 'var(--radius-2xl)',
            full:  '9999px',
          },
          boxShadow: {
            xs: 'var(--shadow-xs)',
            sm: 'var(--shadow-sm)',
            md: 'var(--shadow-md)',
            lg: 'var(--shadow-lg)',
            xl: 'var(--shadow-xl)',
          },
        }
      }
    }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="/static/js/alpine.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/tokens.css?v=6">
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Aurora background -->
    <div aria-hidden="true"
         style="position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none">
        <div class="aurora-orb"
             style="width:min(800px,90vw);height:min(800px,90vw);top:-30%;left:-20%;
                    background:radial-gradient(circle,rgba(37,99,235,0.55) 0%,rgba(56,189,248,0.20) 42%,transparent 68%);
                    filter:blur(70px);
                    animation:aurora-drift-1 22s ease-in-out infinite alternate;"></div>
        <div class="aurora-orb"
             style="width:min(700px,80vw);height:min(700px,80vw);bottom:-25%;right:-20%;
                    background:radial-gradient(circle,rgba(124,58,237,0.35) 0%,rgba(139,92,246,0.13) 42%,transparent 68%);
                    filter:blur(70px);
                    animation:aurora-drift-2 30s ease-in-out infinite alternate;"></div>
        <div class="aurora-orb"
             style="width:min(600px,68vw);height:min(600px,68vw);top:30%;right:-15%;
                    background:radial-gradient(circle,rgba(14,165,233,0.30) 0%,rgba(6,182,212,0.10) 42%,transparent 68%);
                    filter:blur(65px);
                    animation:aurora-drift-3 36s ease-in-out infinite alternate-reverse;"></div>
        <div class="aurora-orb"
             style="width:min(520px,56vw);height:min(520px,56vw);bottom:-10%;left:-10%;
                    background:radial-gradient(circle,rgba(236,72,153,0.22) 0%,transparent 65%);
                    filter:blur(60px);
                    animation:aurora-drift-4 42s ease-in-out infinite alternate;"></div>
    </div>

    <div class="max-w-md w-full" x-data="login()">

        <!-- Logo -->
        <div class="flex items-center justify-center gap-3 mb-8">
            <div class="logo-icon w-10 h-10 rounded-xl flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                     stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                    <polyline points="9 22 9 12 15 12 15 22"/>
                </svg>
            </div>
            <span class="font-display font-extrabold text-2xl tracking-tight"
                  style="color: var(--color-text-primary)">RentFlow</span>
        </div>

        <!-- Card -->
        <div class="card-static p-8 space-y-6">
            <div class="text-center space-y-1">
                <h1 class="font-display font-bold text-xl"
                    style="color: var(--color-text-primary)">Đăng nhập</h1>
                <p class="text-sm" style="color: var(--color-text-tertiary)">
                    Hệ thống quản lý nhà trọ thông minh
                </p>
            </div>

            <form @submit.prevent="submit" class="space-y-4">
                <div>
                    <label class="th-cell block mb-1.5">Tài khoản</label>
                    <input type="text" x-model="username" required
                           class="input-base input-base--lg"
                           placeholder="admin">
                </div>
                <div>
                    <label class="th-cell block mb-1.5">Mật khẩu</label>
                    <input type="password" x-model="password" required
                           class="input-base input-base--lg"
                           placeholder="••••••••">
                </div>

                <div x-show="error" x-cloak
                     x-text="error"
                     class="text-xs font-semibold p-3 rounded-lg border"
                     style="background: var(--color-unpaid-bg);
                            border-color: var(--color-unpaid-border);
                            color: var(--color-unpaid-text)"></div>

                <button type="submit" :disabled="loading"
                        class="btn btn--primary btn--lg w-full disabled:opacity-50 disabled:cursor-not-allowed">
                    <span x-show="!loading">Đăng nhập</span>
                    <span x-show="loading">Đang xử lý...</span>
                </button>
            </form>
        </div>

        <p class="text-center text-xs mt-6"
           style="color: var(--color-text-disabled)">
            © 2026 RentFlow System
        </p>
    </div>

    <script>
        function login() {
            return {
                username: '',
                password: '',
                loading: false,
                error: '',
                async submit() {
                    this.loading = true;
                    this.error = '';
                    try {
                        const res = await fetch('/api/auth/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ username: this.username, password: this.password })
                        });
                        const data = await res.json();
                        if (res.ok) {
                            window.location.href = '/';
                        } else {
                            this.error = data.detail || 'Đăng nhập thất bại';
                        }
                    } catch (e) {
                        this.error = 'Lỗi kết nối server';
                    } finally {
                        this.loading = false;
                    }
                }
            }
        }
    </script>
</body>
</html>
