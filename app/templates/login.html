<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - RentFlow</title>
    <script>
    /* tailwind.config PHẢI đặt TRƯỚC script CDN */
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gray: {
              50:  'var(--neutral-50)',
              100: 'var(--neutral-100)',
              200: 'var(--neutral-200)',
              300: 'var(--neutral-300)',
              400: 'var(--neutral-400)',
              500: 'var(--neutral-500)',
              600: 'var(--neutral-600)',
              700: 'var(--neutral-700)',
              800: 'var(--neutral-800)',
              900: 'var(--neutral-900)',
            },
            blue: {
              50:  'var(--blue-50)',
              100: 'var(--blue-100)',
              200: 'var(--blue-200)',
              300: 'var(--blue-300)',
              400: 'var(--blue-400)',
              500: 'var(--blue-500)',
              600: 'var(--blue-600)',
              700: 'var(--blue-700)',
              800: 'var(--blue-800)',
              900: 'var(--blue-900)',
            },
            green: {
              50:  'var(--green-50)',
              100: 'var(--green-100)',
              200: 'var(--green-200)',
              500: 'var(--green-500)',
              600: 'var(--green-600)',
              700: 'var(--green-700)',
            },
            red: {
              50:  'var(--red-50)',
              100: 'var(--red-100)',
              200: 'var(--red-200)',
              500: 'var(--red-500)',
              600: 'var(--red-600)',
              700: 'var(--red-700)',
            },
            amber: {
              50:  'var(--amber-50)',
              100: 'var(--amber-100)',
              500: 'var(--amber-500)',
              600: 'var(--amber-600)',
            },
          },
          fontFamily: {
            sans:    ['var(--font-body)',    'system-ui', 'sans-serif'],
            display: ['var(--font-display)', 'serif'],
          },
          borderRadius: {
            sm:    'var(--radius-sm)',
            md:    'var(--radius-md)',
            lg:    'var(--radius-lg)',
            xl:    'var(--radius-xl)',
            '2xl': 'var(--radius-2xl)',
            full:  '9999px',
          },
          boxShadow: {
            xs: 'var(--shadow-xs)',
            sm: 'var(--shadow-sm)',
            md: 'var(--shadow-md)',
            lg: 'var(--shadow-lg)',
            xl: 'var(--shadow-xl)',
          },
          transitionTimingFunction: {
            out: 'var(--ease-out)',
            in:  'var(--ease-in)',
            std: 'var(--ease-std)',
          },
          transitionDuration: {
            fast:   'var(--duration-fast)',
            normal: 'var(--duration-normal)',
            slow:   'var(--duration-slow)',
          },
        }
      }
    }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="/static/js/alpine.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/tokens.css?v=3">
    <style>
        body { font-family: var(--font-body, 'DM Sans'), system-ui, sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full" x-data="login()">
        <div class="bg-white rounded-2xl shadow-xl p-8 space-y-6 border border-gray-100">
            <div class="text-center space-y-2">
                <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">RentFlow</h1>
                <p class="text-gray-500 text-sm">Hệ thống quản lý nhà trọ thông minh</p>
            </div>

            <form @submit.prevent="submit" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Tài khoản</label>
                    <input type="text" x-model="username" required
                           class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition bg-gray-50">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Mật khẩu</label>
                    <input type="password" x-model="password" required
                           class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition bg-gray-50">
                </div>

                <div x-show="error" x-text="error" class="text-red-500 text-xs font-semibold bg-red-50 p-3 rounded-lg border border-red-100"></div>

                <button type="submit" :disabled="loading"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-blue-200 transition transform active:scale-[0.98] disabled:opacity-50 disabled:cursor-not-allowed">
                    <span x-show="!loading">Đăng nhập</span>
                    <span x-show="loading">Đang xử lý...</span>
                </button>
            </form>
        </div>
        <p class="text-center text-gray-400 text-xs mt-8">© 2024 RentFlow System. Built with ❤️</p>
    </div>

    <script>
        function login() {
            return {
                username: '',
                password: '',
                loading: false,
                error: '',
                async submit() {
                    this.loading = true;
                    this.error = '';
                    try {
                        const res = await fetch('/api/auth/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ username: this.username, password: this.password })
                        });
                        const data = await res.json();
                        if (res.ok) {
                            window.location.href = '/';
                        } else {
                            this.error = data.detail || 'Đăng nhập thất bại';
                        }
                    } catch (e) {
                        this.error = 'Lỗi kết nối server';
                    } finally {
                        this.loading = false;
                    }
                }
            }
        }
    </script>
</body>
</html>
