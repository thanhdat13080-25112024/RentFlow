<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - RentFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="/static/js/alpine.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full" x-data="login()">
        <div class="bg-white rounded-2xl shadow-xl p-8 space-y-6 border border-gray-100">
            <div class="text-center space-y-2">
                <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">RentFlow</h1>
                <p class="text-gray-500 text-sm">Hệ thống quản lý nhà trọ thông minh</p>
            </div>

            <form @submit.prevent="submit" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Tài khoản</label>
                    <input type="text" x-model="username" required
                           class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition bg-gray-50">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Mật khẩu</label>
                    <input type="password" x-model="password" required
                           class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition bg-gray-50">
                </div>

                <div x-show="error" x-text="error" class="text-red-500 text-xs font-semibold bg-red-50 p-3 rounded-lg border border-red-100"></div>

                <button type="submit" :disabled="loading"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-blue-200 transition transform active:scale-[0.98] disabled:opacity-50 disabled:cursor-not-allowed">
                    <span x-show="!loading">Đăng nhập</span>
                    <span x-show="loading">Đang xử lý...</span>
                </button>
            </form>
        </div>
        <p class="text-center text-gray-400 text-xs mt-8">© 2024 RentFlow System. Built with ❤️</p>
    </div>

    <script>
        function login() {
            return {
                username: '',
                password: '',
                loading: false,
                error: '',
                async submit() {
                    this.loading = true;
                    this.error = '';
                    try {
                        const res = await fetch('/api/auth/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ username: this.username, password: this.password })
                        });
                        const data = await res.json();
                        if (res.ok) {
                            window.location.href = '/';
                        } else {
                            this.error = data.detail || 'Đăng nhập thất bại';
                        }
                    } catch (e) {
                        this.error = 'Lỗi kết nối server';
                    } finally {
                        this.loading = false;
                    }
                }
            }
        }
    </script>
</body>
</html>
