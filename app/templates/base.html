<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#060c18">
    <meta name="theme-color" content="#EFF6FF" media="(prefers-color-scheme: light)">
    <title>{% block title %}RentFlow{% endblock %}</title>
    <!-- Anti-FOUC: apply dark mode BEFORE first paint -->
    <script>
    (function(){
        var t = localStorage.getItem('qlTroTheme');
        if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    })();
    </script>
    <!-- Tailwind CSS đã build tĩnh (thay cho cdn.tailwindcss.com chạy runtime).
         Cấu hình theme nay nằm ở tailwind.config.js; sửa class xong chạy `npm run build:css`. -->
    <link rel="stylesheet" href="/static/css/tailwind.css?v=1">
    <script defer src="/static/js/alpine.min.js"></script>
    <!-- html2canvas: tải lười, chỉ nạp khi xuất ảnh hóa đơn (xem app.js → ensureHtml2Canvas) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&family=Roboto+Condensed:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/tokens.css?v=16">
    <style>
        [x-cloak] { display: none !important; }
        body {
            font-family: var(--font-body, 'Roboto'), system-ui, sans-serif;
            color: var(--color-text-primary);
            background: var(--color-bg);
        }
        #invoice-content { width: 800px !important; background: white !important; }
        #invoice-content * { line-height: 1.4 !important; vertical-align: middle !important; }
        #invoice-content .flex { display: flex !important; }
        .bar-segment { transition: height 0.6s cubic-bezier(.4,0,.2,1); }
        @keyframes slideUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
        .slide-up { animation: slideUp 0.2s ease-out; }

        /* ── loading skeleton (shimmer) ── */
        .skeleton { position: relative; overflow: hidden;
            background: var(--surface-2, rgba(140,140,140,.12));
            border-radius: var(--radius-md, 12px); }
        .skeleton::after { content:""; position:absolute; inset:0; transform: translateX(-100%);
            background: linear-gradient(90deg, transparent, rgba(0,0,0,.06), transparent);
            animation: shimmer 1.3s infinite; }
        @keyframes shimmer { 100% { transform: translateX(100%); } }

        /* ── Entrance / micro-interaction animations (balanced) ── */
        @keyframes fadeInUp { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform: none; } }
        .fade-in-up { animation: fadeInUp .4s var(--ease, cubic-bezier(.4,0,.2,1)) both; }
        @keyframes pop { 0% { transform: scale(.6); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
        .toast-pop { animation: pop .35s var(--ease, ease-out); }
        @keyframes flashOk { 0% { background: var(--color-paid-bg, rgba(62,122,86,.20)); } 100% { background: transparent; } }
        .flash-ok { animation: flashOk .9s var(--ease, ease-out); }

        /* ── Respect prefers-reduced-motion (accessibility) ── */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .001ms !important; animation-iteration-count: 1 !important;
                transition-duration: .001ms !important; scroll-behavior: auto !important;
            }
            .skeleton::after { display: none; }
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body class="min-h-screen overflow-x-hidden" style="color: var(--color-text-primary)"
      x-data="app({{ month }}, {{ year }})" x-init="init()" x-cloak
      @keydown.window="handleKeydown($event)">

    {% include 'components/_lg_filters.html' %}

    {% block content %}{% endblock %}

    {% block scripts %}{% endblock %}
</body>
</html>
