<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#060c18">
    <meta name="theme-color" content="#EFF6FF" media="(prefers-color-scheme: light)">
    <title>{% block title %}RentFlow{% endblock %}</title>
    <script>
    /* tailwind.config PHẢI đặt TRƯỚC <script src="cdn.tailwindcss.com">.
       Nếu đặt sau, Tailwind CDN đã khởi tạo xong và bỏ qua config này. */
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gray: {
              50:  'var(--paper)',
              100: 'var(--surface-2)',
              200: 'var(--line)',
              300: 'var(--line-strong)',
              400: 'var(--ink-3)',
              500: 'var(--ink-2)',
              600: 'var(--ink-2)',
              700: 'var(--ink-1)',
              800: 'var(--ink-1)',
              900: 'var(--ink)',
            },
            violet: {
              50:  'var(--accent-tint)',
              100: 'var(--accent-tint)',
              500: 'var(--accent)',
              600: 'var(--accent)',
              700: 'var(--accent-strong)',
              900: 'var(--accent-strong)',
            },
            blue: {
              50:  'var(--accent-tint)',
              100: 'var(--accent-tint)',
              500: 'var(--accent)',
              600: 'var(--accent)',
              700: 'var(--accent-strong)',
              900: 'var(--accent-strong)',
            },
            sky: {
              500: 'var(--accent)',
            },
            indigo: {
              500: 'var(--accent)',
            },
            cyan: {
              500: 'var(--accent)',
            },
            green: {
              50:  'var(--success-tint)',
              100: 'var(--success-tint)',
              200: 'var(--success-tint)',
              500: 'var(--success)',
              600: 'var(--success)',
              700: 'var(--success)',
            },
            red: {
              50:  'var(--danger-tint)',
              100: 'var(--danger-tint)',
              200: 'var(--danger-tint)',
              500: 'var(--danger)',
              600: 'var(--danger)',
              700: 'var(--danger)',
            },
            amber: {
              50:  'var(--warning-tint)',
              100: 'var(--warning-tint)',
              500: 'var(--warning)',
              600: 'var(--warning)',
            },
          },

          fontFamily: {
            sans:    ['var(--font-body)',    'system-ui', 'sans-serif'],
            display: ['var(--font-display)', 'serif'],
          },
          borderRadius: {
            sm:    'var(--radius-sm)',
            md:    'var(--radius-md)',
            lg:    'var(--radius-lg)',
            xl:    'var(--radius-xl)',
            '2xl': 'var(--radius-2xl)',
            full:  '9999px',
          },
          boxShadow: {
            xs: 'var(--shadow-xs)',
            sm: 'var(--shadow-sm)',
            md: 'var(--shadow-md)',
            lg: 'var(--shadow-lg)',
            xl: 'var(--shadow-xl)',
          },
          transitionTimingFunction: {
            out: 'var(--ease-out)',
            in:  'var(--ease-in)',
            std: 'var(--ease-std)',
          },
          transitionDuration: {
            fast:   'var(--duration-fast)',
            normal: 'var(--duration-normal)',
            slow:   'var(--duration-slow)',
          },
        }
      }
    }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="/static/js/alpine.min.js"></script>
    <script src="/static/js/html2canvas.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&family=Roboto+Condensed:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/tokens.css?v=10">
    <style>
        [x-cloak] { display: none !important; }
        body {
            font-family: var(--font-body, 'Roboto'), system-ui, sans-serif;
            color: var(--color-text-primary);
            background: var(--color-bg);
        }
        #invoice-content { width: 800px !important; background: white !important; }
        #invoice-content * { line-height: 1.4 !important; vertical-align: middle !important; }
        #invoice-content .flex { display: flex !important; }
        .bar-segment { transition: height 0.6s cubic-bezier(.4,0,.2,1); }
        @keyframes slideUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
        .slide-up { animation: slideUp 0.2s ease-out; }

        /* ── Phase 4: loading skeleton (shimmer) ── */
        .skeleton { position: relative; overflow: hidden;
            background: var(--surface-2, rgba(140,140,140,.12));
            border-radius: var(--radius-md, 12px); }
        .skeleton::after { content:""; position:absolute; inset:0; transform: translateX(-100%);
            background: linear-gradient(90deg, transparent, rgba(0,0,0,.06), transparent);
            animation: shimmer 1.3s infinite; }
        @keyframes shimmer { 100% { transform: translateX(100%); } }

        /* ── Respect prefers-reduced-motion (accessibility) ── */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .001ms !important; animation-iteration-count: 1 !important;
                transition-duration: .001ms !important; scroll-behavior: auto !important;
            }
            .skeleton::after { display: none; }
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body class="min-h-screen overflow-x-hidden" style="color: var(--color-text-primary)"
      x-data="app({{ month }}, {{ year }})" x-init="init()" x-cloak
      @keydown.window="handleKeydown($event)">

    {% include 'components/_lg_filters.html' %}

    {% block content %}{% endblock %}

    {% block scripts %}{% endblock %}
</body>
</html>
