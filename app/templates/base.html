<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#060c18">
    <meta name="theme-color" content="#EFF6FF" media="(prefers-color-scheme: light)">
    <title>{% block title %}RentFlow{% endblock %}</title>
    <script>
    /* tailwind.config PHẢI đặt TRƯỚC <script src="cdn.tailwindcss.com">.
       Nếu đặt sau, Tailwind CDN đã khởi tạo xong và bỏ qua config này. */
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gray: {
              50:  'var(--neutral-50)',
              100: 'var(--neutral-100)',
              200: 'var(--neutral-200)',
              300: 'var(--neutral-300)',
              400: 'var(--neutral-400)',
              500: 'var(--neutral-500)',
              600: 'var(--neutral-600)',
              700: 'var(--neutral-700)',
              800: 'var(--neutral-800)',
              900: 'var(--neutral-900)',
            },
            violet: {
              50:  'var(--violet-50)',
              100: 'var(--violet-100)',
              200: 'var(--violet-200)',
              300: 'var(--violet-300)',
              400: 'var(--violet-400)',
              500: 'var(--violet-500)',
              600: 'var(--violet-600)',
              700: 'var(--violet-700)',
              800: 'var(--violet-800)',
              900: 'var(--violet-900)',
            },
            blue: {
              50:  'var(--blue-50)',
              100: 'var(--blue-100)',
              200: 'var(--blue-200)',
              300: 'var(--blue-300)',
              400: 'var(--blue-400)',
              500: 'var(--blue-500)',
              600: 'var(--blue-600)',
              700: 'var(--blue-700)',
              800: 'var(--blue-800)',
              900: 'var(--blue-900)',
            },
            sky: {
              50:  'var(--sky-50)',
              100: 'var(--sky-100)',
              200: 'var(--sky-200)',
              300: 'var(--sky-300)',
              400: 'var(--sky-400)',
              500: 'var(--sky-500)',
              600: 'var(--sky-600)',
              700: 'var(--sky-700)',
            },
            indigo: {
              50:  'var(--indigo-50)',
              100: 'var(--indigo-100)',
              200: 'var(--indigo-200)',
              300: 'var(--indigo-300)',
              400: 'var(--indigo-400)',
              500: 'var(--indigo-500)',
              600: 'var(--indigo-600)',
              700: 'var(--indigo-700)',
              800: 'var(--indigo-800)',
              900: 'var(--indigo-900)',
            },
            cyan: {
              50:  'var(--cyan-50)',
              100: 'var(--cyan-100)',
              200: 'var(--cyan-200)',
              300: 'var(--cyan-300)',
              400: 'var(--cyan-400)',
              500: 'var(--cyan-500)',
              600: 'var(--cyan-600)',
              700: 'var(--cyan-700)',
              800: 'var(--cyan-800)',
              900: 'var(--cyan-900)',
            },
            green: {
              50:  'var(--green-50)',
              100: 'var(--green-100)',
              200: 'var(--green-200)',
              500: 'var(--green-500)',
              600: 'var(--green-600)',
              700: 'var(--green-700)',
            },
            red: {
              50:  'var(--red-50)',
              100: 'var(--red-100)',
              200: 'var(--red-200)',
              500: 'var(--red-500)',
              600: 'var(--red-600)',
              700: 'var(--red-700)',
            },
            amber: {
              50:  'var(--amber-50)',
              100: 'var(--amber-100)',
              500: 'var(--amber-500)',
              600: 'var(--amber-600)',
            },
          },
          fontFamily: {
            sans:    ['var(--font-body)',    'system-ui', 'sans-serif'],
            display: ['var(--font-display)', 'serif'],
          },
          borderRadius: {
            sm:    'var(--radius-sm)',
            md:    'var(--radius-md)',
            lg:    'var(--radius-lg)',
            xl:    'var(--radius-xl)',
            '2xl': 'var(--radius-2xl)',
            full:  '9999px',
          },
          boxShadow: {
            xs: 'var(--shadow-xs)',
            sm: 'var(--shadow-sm)',
            md: 'var(--shadow-md)',
            lg: 'var(--shadow-lg)',
            xl: 'var(--shadow-xl)',
          },
          transitionTimingFunction: {
            out: 'var(--ease-out)',
            in:  'var(--ease-in)',
            std: 'var(--ease-std)',
          },
          transitionDuration: {
            fast:   'var(--duration-fast)',
            normal: 'var(--duration-normal)',
            slow:   'var(--duration-slow)',
          },
        }
      }
    }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="/static/js/alpine.min.js"></script>
    <script src="/static/js/html2canvas.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/tokens.css?v=10">
    <style>
        [x-cloak] { display: none !important; }
        body {
            font-family: var(--font-body, 'DM Sans'), system-ui, sans-serif;
            color: var(--color-text-primary);
        }
        #invoice-content { width: 800px !important; background: white !important; }
        #invoice-content * { line-height: 1.4 !important; vertical-align: middle !important; }
        #invoice-content .flex { display: flex !important; }
        .bar-segment { transition: height 0.6s cubic-bezier(.4,0,.2,1); }
        @keyframes slideUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
        .slide-up { animation: slideUp 0.2s ease-out; }
    </style>
    {% block head %}{% endblock %}
</head>
<body class="min-h-screen overflow-x-hidden" style="color: var(--color-text-primary)"
      x-data="app({{ month }}, {{ year }})" x-init="init()" x-cloak
      @keydown.window="handleKeydown($event)">

    {% include 'components/_lg_filters.html' %}

    {% block content %}{% endblock %}

    {% block scripts %}{% endblock %}
</body>
</html>
