<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản Lý Trọ — Wireframes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Patrick+Hand&family=Kalam:wght@400;700&family=Architects+Daughter&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1a1a;
    --ink-2: #5a5a5a;
    --ink-3: #a8a39a;
    --paper: #faf6ec;
    --paper-2: #f1ecdb;
    --paper-3: #e8e2cc;
    --accent: #dc4a3f;
    --accent-soft: #f7d6d2;
    --ok: #2f7a4a;
    --ok-soft: #c9e3cf;
    --warn: #c97a14;
    --warn-soft: #f4dcb4;
    --info: #2a5a9e;
    --info-soft: #c9d8ed;
    --font-sketch: 'Patrick Hand', 'Caveat', cursive;
    --font-head: 'Caveat', 'Patrick Hand', cursive;
  }
  html, body {
    margin: 0;
    padding: 0;
    background: #d9d2bf;
    font-family: var(--font-sketch);
    color: var(--ink);
    overflow: hidden;
    height: 100%;
  }
  #root { width: 100vw; height: 100vh; }

  /* ── Sketchy primitives ─────────────────────────────── */
  .wf-art {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-sketch);
    font-size: 16px;
    line-height: 1.2;
    overflow: hidden;
    position: relative;
  }
  .wf-art * { box-sizing: border-box; }

  .wf-card {
    background: var(--paper);
    border: 2px solid var(--ink);
    border-radius: 10px;
    box-shadow: 3px 3px 0 var(--ink);
  }
  .wf-card-soft {
    background: var(--paper);
    border: 2px solid var(--ink);
    border-radius: 10px;
  }
  .wf-dashed {
    background: transparent;
    border: 2px dashed var(--ink-2);
    border-radius: 8px;
  }
  .wf-fill { background: var(--paper-2); }
  .wf-line { height: 2px; background: var(--ink-2); border-radius: 2px; }
  .wf-line-2 { height: 2px; background: var(--ink-3); border-radius: 2px; }
  .wf-line-thick { height: 5px; background: var(--ink); border-radius: 3px; }

  .wf-head {
    font-family: var(--font-head);
    font-weight: 700;
    color: var(--ink);
  }
  .wf-h1 { font-family: var(--font-head); font-size: 36px; font-weight: 700; line-height: 1; }
  .wf-h2 { font-family: var(--font-head); font-size: 26px; font-weight: 700; line-height: 1; }
  .wf-h3 { font-family: var(--font-head); font-size: 20px; font-weight: 700; line-height: 1; }
  .wf-mono {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 12px;
    letter-spacing: 0.02em;
  }
  .wf-label {
    font-family: var(--font-sketch);
    font-size: 13px;
    color: var(--ink-2);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .wf-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 10px 2px;
    border-radius: 999px;
    border: 1.5px solid var(--ink);
    font-size: 13px;
    background: var(--paper);
    white-space: nowrap;
  }
  .wf-pill-red { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .wf-pill-green { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
  .wf-pill-blue { background: var(--info-soft); border-color: var(--info); color: var(--info); }
  .wf-pill-warn { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
  .wf-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 7px 14px 6px;
    border-radius: 8px;
    border: 2px solid var(--ink);
    background: var(--paper);
    font-family: var(--font-sketch);
    font-size: 15px;
    box-shadow: 2px 2px 0 var(--ink);
    cursor: default;
  }
  .wf-btn-primary { background: var(--accent); color: white; }
  .wf-btn-ghost { background: transparent; box-shadow: none; }
  .wf-tab {
    padding: 8px 16px 6px;
    border-radius: 8px;
    font-family: var(--font-head);
    font-size: 19px;
    color: var(--ink-2);
  }
  .wf-tab.active {
    background: var(--ink);
    color: var(--paper);
  }
  .wf-input {
    border: 2px solid var(--ink);
    border-radius: 8px;
    padding: 6px 12px;
    background: var(--paper);
    font-family: var(--font-sketch);
    font-size: 15px;
    box-shadow: inset 1px 1px 0 rgba(0,0,0,0.06);
  }
  .wf-tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    background: var(--paper-2);
    border: 1.5px solid var(--ink-3);
    font-size: 12px;
    color: var(--ink-2);
  }

  /* Sticky note for annotations */
  .wf-note {
    background: #fff3a3;
    border: 1.5px solid #c4a83a;
    box-shadow: 2px 3px 0 rgba(0,0,0,0.15);
    padding: 10px 12px;
    font-family: 'Caveat', cursive;
    font-size: 17px;
    line-height: 1.15;
    color: #5a4a10;
    transform: rotate(-1.2deg);
    border-radius: 4px;
    max-width: 220px;
  }
  .wf-note.right { transform: rotate(1.2deg); }
  .wf-note-arrow {
    position: absolute;
    pointer-events: none;
    stroke: #c4a83a;
    fill: none;
    stroke-width: 2;
  }

  /* Sketchy bar chart bars */
  .wf-bar {
    background: var(--ink);
    border-radius: 4px 4px 0 0;
    position: relative;
  }
  .wf-bar.accent { background: var(--accent); }
  .wf-bar.soft { background: var(--ink-3); }

  /* Avatar placeholder */
  .wf-avatar {
    width: 36px; height: 36px;
    border-radius: 999px;
    border: 2px solid var(--ink);
    background: var(--paper-2);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-head);
    font-size: 17px;
  }

  /* Status dot */
  .wf-dot { width: 12px; height: 12px; border-radius: 999px; border: 1.5px solid var(--ink); display: inline-block; }
  .wf-dot.red { background: var(--accent); }
  .wf-dot.green { background: var(--ok); }
  .wf-dot.blue { background: var(--info); }
  .wf-dot.empty { background: var(--paper-2); border-color: var(--ink-3); }

  /* Phone frame */
  .wf-phone {
    width: 320px;
    height: 660px;
    border: 3px solid var(--ink);
    border-radius: 32px;
    background: var(--paper);
    box-shadow: 4px 4px 0 var(--ink);
    overflow: hidden;
    position: relative;
  }
  .wf-phone-notch {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 90px; height: 18px;
    background: var(--ink);
    border-radius: 0 0 12px 12px;
  }

  /* Decorative scribble underline */
  .wf-underline {
    text-decoration: underline wavy var(--accent) 2px;
    text-underline-offset: 4px;
  }

  /* Section header for canvas */
  .dc-section-title {
    font-family: var(--font-head) !important;
    font-size: 28px !important;
  }

  /* Tweaks panel theme override */
  .tweaks-panel { font-family: var(--font-sketch) !important; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="wf-shared.jsx"></script>
<script type="text/babel" src="wf-desktop.jsx"></script>
<script type="text/babel" src="wf-extra.jsx"></script>
<script type="text/babel" src="wf-app.jsx"></script>
</body>
</html>
