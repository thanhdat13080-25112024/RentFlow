<!-- ═══════════════════════════════════════
     TAB: REVENUE
═══════════════════════════════════════ -->
<div x-show="activeTab === 'revenue'" class="space-y-6">
    <div class="flex items-center justify-between">
        <h2 class="text-xl font-extrabold text-gray-800" x-text="t.revenueTitle"></h2>
    </div>

    <!-- Mini bar chart -->
    <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-5" x-show="revenueSummary.length > 0">
        <h3 class="font-bold text-gray-700 mb-4" x-text="t.chartTitle"></h3>
        <div class="flex items-end gap-2 h-32 border-b border-gray-100 pb-1">
            <template x-for="bar in revChartData" :key="bar.label">
                <div class="flex flex-col items-center justify-end gap-1 flex-1 h-full">
                    <span class="text-[10px] text-gray-400" x-text="(bar.v/1e6).toFixed(0)+'M'"></span>
                    <div class="w-full rounded-t-lg bar-segment"
                         :class="bar.current ? 'bg-indigo-600' : 'bg-indigo-200'"
                         :style="'height:' + Math.max(bar.pct, 4) + '%'"></div>
                    <span class="text-[10px] font-semibold" :class="bar.current ? 'text-indigo-600' : 'text-gray-400'" x-text="bar.label"></span>
                </div>
            </template>
        </div>
    </div>

    <!-- Revenue table -->
    <div class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
        <table class="w-full text-sm">
            <thead class="bg-gray-50 border-b">
                <tr class="text-xs font-bold text-gray-500 uppercase tracking-wide">
                    <th class="px-5 py-3 text-left" x-text="t.revMonth"></th>
                    <th class="px-5 py-3 text-right" x-text="t.electricityFee"></th>
                    <th class="px-5 py-3 text-right" x-text="t.serviceFee"></th>
                    <th class="px-5 py-3 text-right" x-text="t.rentFee"></th>
                    <th class="px-5 py-3 text-right" x-text="t.totalAmount"></th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-50">
                <template x-for="row in revenueSummary" :key="row.month + '-' + row.year">
                    <tr class="hover:bg-gray-50 transition-colors">
                        <td class="px-5 py-4 font-bold text-gray-800 text-lg" x-text="row.month + '/' + row.year"></td>
                        <td class="px-5 py-4 text-right text-orange-600 font-semibold" x-text="formatMoney(row.total_elec)"></td>
                        <td class="px-5 py-4 text-right text-gray-500 font-semibold" x-text="formatMoney(row.total_service)"></td>
                        <td class="px-5 py-4 text-right text-blue-600 font-semibold" x-text="formatMoney(row.total_rent)"></td>
                        <td class="px-5 py-4 text-right font-extrabold text-indigo-700 text-lg" x-text="formatMoney(row.total_revenue)"></td>
                    </tr>
                </template>
            </tbody>
        </table>
        <template x-if="revenueSummary.length === 0">
            <div class="py-16 text-center text-gray-300">
                <i class="fas fa-chart-pie text-4xl mb-3 block"></i>
                <p class="text-sm font-semibold" x-text="t.noRevData"></p>
            </div>
        </template>
    </div>
</div>
